<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>パスワード再設定</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dk: #1d4ed8;
      --bg: #eff6ff;
      --surface: #ffffff;
      --border: #dbe4f0;
      --text: #1e293b;
      --sub: #64748b;
      --danger: #dc2626;
      --success: #16a34a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
      background: linear-gradient(180deg, var(--bg) 0%, #f8fafc 100%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 520px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 16px 36px rgba(15, 23, 42, 0.08);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.3;
    }
    .sub {
      color: var(--sub);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 18px;
      white-space: pre-wrap;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }
    label {
      font-size: 13px;
      font-weight: 700;
    }
    input {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      background: #fff;
    }
    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
    }
    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      background: var(--primary);
      color: #fff;
      width: 100%;
    }
    .btn:hover { background: var(--primary-dk); }
    .msg {
      margin-top: 14px;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      display: none;
      white-space: pre-wrap;
    }
    .msg.show { display: block; }
    .msg.ok {
      border: 1px solid #bbf7d0;
      background: #f0fdf4;
      color: #166534;
    }
    .msg.ng {
      border: 1px solid #fecaca;
      background: #fef2f2;
      color: #991b1b;
    }
    .link-row {
      margin-top: 16px;
      font-size: 13px;
      text-align: center;
    }
    .link-row a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>パスワード再設定</h1>
    <p class="sub" id="pageIntro">メールの再設定リンクから開いたあと、この画面で新しいパスワードを設定してください。</p>

    <form id="resetForm">
      <div class="field">
        <label for="newPassword">新しいパスワード</label>
        <input id="newPassword" type="password" placeholder="8文字以上を推奨" />
      </div>
      <div class="field">
        <label for="confirmPassword">新しいパスワード（確認）</label>
        <input id="confirmPassword" type="password" placeholder="もう一度入力" />
      </div>
      <button class="btn" id="resetBtn" type="submit">パスワードを更新する</button>
    </form>

    <div class="msg" id="statusMsg"></div>
    <div class="link-row"><a href="index.html">案件管理ダッシュボードへ戻る</a></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://vspmaejoftjvooohfqbu.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZzcG1hZWpvZnRqdm9vb2hmcWJ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyODkxODQsImV4cCI6MjA5Mzg2NTE4NH0.vt33TF7OfmNHOMFUP-_Ch6TESVBPW22d-1W3LKkbrHI';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const resetForm = document.getElementById('resetForm');
    const statusMsg = document.getElementById('statusMsg');
    const resetBtn = document.getElementById('resetBtn');
    const pageIntro = document.getElementById('pageIntro');

    function showMessage(message, ok) {
      statusMsg.textContent = message;
      statusMsg.className = 'msg show ' + (ok ? 'ok' : 'ng');
    }

    function getTokensFromUrl() {
      const hash = location.hash.startsWith('#') ? location.hash.slice(1) : '';
      const params = new URLSearchParams(hash);
      return {
        accessToken: params.get('access_token') || '',
        refreshToken: params.get('refresh_token') || '',
        type: params.get('type') || '',
      };
    }

    async function bootstrapRecoverySession() {
      const { accessToken, refreshToken, type } = getTokensFromUrl();
      if (!accessToken || !refreshToken || type !== 'recovery') {
        pageIntro.textContent = '再設定リンクが無効、または期限切れの可能性があります。パスワード再設定メールを再送してください。';
        showMessage('有効な再設定リンクではありません。', false);
        resetBtn.disabled = true;
        return false;
      }

      const { error } = await db.auth.setSession({
        access_token: accessToken,
        refresh_token: refreshToken,
      });

      if (error) {
        showMessage('再設定セッションの開始に失敗しました: ' + error.message, false);
        resetBtn.disabled = true;
        return false;
      }
      return true;
    }

    resetForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (!newPassword || !confirmPassword) {
        showMessage('新しいパスワードを入力してください。', false);
        return;
      }
      if (newPassword !== confirmPassword) {
        showMessage('確認用パスワードが一致しません。', false);
        return;
      }
      if (newPassword.length < 8) {
        showMessage('パスワードは8文字以上を推奨します。', false);
        return;
      }

      resetBtn.disabled = true;
      resetBtn.textContent = '更新中...';

      const { error } = await db.auth.updateUser({ password: newPassword });

      resetBtn.disabled = false;
      resetBtn.textContent = 'パスワードを更新する';

      if (error) {
        showMessage('パスワード更新に失敗しました: ' + error.message, false);
        return;
      }

      showMessage('パスワードを更新しました。案件管理ダッシュボードに戻ってログインしてください。', true);
      resetForm.reset();
      history.replaceState({}, document.title, location.pathname);
    });

    bootstrapRecoverySession();
  </script>
</body>
</html>
