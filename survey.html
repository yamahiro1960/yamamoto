<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>アンケート管理</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dk: #1d4ed8;
      --bg: #f1f5f9;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --sub: #64748b;
      --danger: #dc2626;
      --success: #16a34a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
      background: linear-gradient(180deg, #eff6ff 0%, var(--bg) 100%);
      color: var(--text);
      min-height: 100vh;
    }
    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 16px 48px;
    }
    .head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .title {
      font-size: 28px;
      font-weight: 800;
      margin: 0;
    }
    .sub {
      color: var(--sub);
      margin: 6px 0 0;
      font-size: 14px;
      line-height: 1.5;
    }
    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dk); }
    .btn-ghost {
      background: #fff;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-ghost:hover { background: #f8fafc; }
    .btn-danger {
      background: #fee2e2;
      border: 1px solid #fecaca;
      color: #991b1b;
    }
    .top-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .auth-status {
      font-size: 13px;
      color: var(--sub);
    }
    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 10px 24px rgba(30, 41, 59, 0.08);
    }
    .toolbar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 14px;
      border-bottom: 1px solid var(--border);
    }
    .search {
      min-width: 220px;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      padding: 8px 10px;
    }
    .search input {
      border: none;
      outline: none;
      flex: 1;
      font-size: 14px;
    }
    .table-wrap {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 860px;
    }
    thead th {
      text-align: left;
      padding: 12px 14px;
      font-size: 12px;
      text-transform: uppercase;
      color: var(--sub);
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    tbody td {
      padding: 14px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
      vertical-align: top;
    }
    tbody tr:hover { background: #f8fbff; }
    tbody tr:last-child td { border-bottom: none; }
    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 12px;
      font-weight: 700;
    }
    .badge-open { background: #dcfce7; color: #166534; }
    .badge-stop { background: #fee2e2; color: #991b1b; }
    .actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .public-url {
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--sub);
      word-break: break-all;
    }
    .public-url code {
      font-family: Consolas, monospace;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1px 6px;
      color: var(--text);
    }
    .public-url .mini {
      padding: 4px 8px;
      font-size: 11px;
    }
    .mini {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 10px;
      cursor: pointer;
      color: var(--text);
      text-decoration: none;
    }
    .mini:hover { background: #f8fafc; }
    .empty {
      margin: 14px;
      border: 1px dashed var(--border);
      border-radius: 10px;
      padding: 24px;
      text-align: center;
      color: var(--sub);
      font-size: 14px;
    }
    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      background: #0f172a;
      color: #fff;
      border-radius: 10px;
      font-size: 14px;
      padding: 10px 14px;
      opacity: 0;
      transform: translateY(20px);
      transition: .2s;
      z-index: 999;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.48);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
      z-index: 1200;
    }
    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }
    .modal {
      width: 980px;
      max-width: 100%;
      max-height: 92vh;
      overflow: auto;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 20px 56px rgba(15, 23, 42, 0.26);
    }
    .modal-head {
      position: sticky;
      top: 0;
      z-index: 4;
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }
    .modal-title {
      font-size: 18px;
      font-weight: 800;
    }
    .close-btn {
      width: 34px;
      height: 34px;
      border: none;
      border-radius: 9px;
      background: #f1f5f9;
      cursor: pointer;
      font-size: 18px;
    }
    .close-btn:hover { background: #e2e8f0; }
    .modal-body {
      padding: 16px;
      display: grid;
      gap: 14px;
    }
    .response-list {
      display: grid;
      gap: 12px;
    }
    .response-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #f8fafc;
      padding: 12px;
      display: grid;
      gap: 8px;
    }
    .response-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .response-meta {
      font-size: 12px;
      color: var(--sub);
    }
    .response-items {
      display: grid;
      gap: 8px;
    }
    .response-item {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
    }
    .response-item-label {
      font-size: 12px;
      color: var(--sub);
      font-weight: 700;
      margin-bottom: 3px;
    }
    .response-item-value {
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .field label {
      font-size: 13px;
      font-weight: 700;
    }
    .field input,
    .field textarea,
    .field select {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 10px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }
    .field input:focus,
    .field textarea:focus,
    .field select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
    }
    .field textarea {
      min-height: 88px;
      resize: vertical;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .question-box {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      background: #f8fafc;
      display: grid;
      gap: 8px;
    }
    .question-desc {
      min-height: 72px;
    }
    .question-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
      font-weight: 800;
    }
    .question-options {
      display: none;
    }
    .question-options.show {
      display: block;
    }
    .modal-foot {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      border-top: 1px solid var(--border);
      padding: 14px 16px;
      position: sticky;
      bottom: 0;
      background: #fff;
    }

    @media (max-width: 760px) {
      .row { grid-template-columns: 1fr; }
      .title { font-size: 23px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div>
        <h1 class="title">アンケート管理</h1>
        <p class="sub">単一回答ページ方式: 公開URLにトークンを付けて複数アンケートを運用します。</p>
        <p class="auth-status" id="authStatus">案件管理画面でログインした状態で利用してください。</p>
      </div>
      <div class="top-actions">
        <a class="btn btn-ghost" href="index.html">案件管理へ戻る</a>
        <button class="btn btn-primary" id="newFormBtn" type="button">+ 新規アンケート作成</button>
      </div>
    </div>

    <div class="card">
      <div class="toolbar">
        <div class="search">
          <span>🔍</span>
          <input id="searchInput" type="text" placeholder="タイトル検索" />
        </div>
        <button class="btn btn-ghost" id="reloadBtn" type="button">再読み込み</button>
      </div>
      <div class="table-wrap" id="tableWrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>タイトル</th>
              <th>公開状態</th>
              <th>設問数</th>
              <th>回答件数</th>
              <th>作成日</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="formsBody"></tbody>
        </table>
      </div>
      <div class="empty" id="emptyBox">アンケートがありません。右上の「新規アンケート作成」から作成してください。</div>
    </div>
  </div>

  <div class="modal-overlay" id="formModalOverlay">
    <div class="modal">
      <div class="modal-head">
        <div class="modal-title" id="formModalTitle">新規アンケート作成</div>
        <button class="close-btn" id="closeFormModalBtn" type="button">✕</button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label for="fTitle">タイトル <span style="color:var(--danger)">*</span></label>
          <input id="fTitle" type="text" placeholder="例: 案件完了後アンケート" />
        </div>
        <div class="field">
          <label for="fIntro">アンケート案内文</label>
          <textarea id="fIntro" placeholder="回答者向けの説明文"></textarea>
        </div>
        <div class="row">
          <div class="field">
            <label for="fPublished">公開状態</label>
            <select id="fPublished">
              <option value="true">公開</option>
              <option value="false">停止</option>
            </select>
          </div>
          <div class="field">
            <label for="fToken">公開トークン（URL識別子）</label>
            <input id="fToken" type="text" placeholder="自動生成されます" />
          </div>
        </div>

        <div class="field">
          <label>設問</label>
          <div id="questionsWrap"></div>
          <button class="btn btn-ghost" id="addQuestionBtn" type="button">+ 設問を追加</button>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" id="cancelFormBtn" type="button">キャンセル</button>
        <button class="btn btn-primary" id="saveFormBtn" type="button">保存する</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="responseModalOverlay">
    <div class="modal">
      <div class="modal-head">
        <div class="modal-title" id="responseModalTitle">回答一覧</div>
        <button class="close-btn" id="closeResponseModalBtn" type="button">✕</button>
      </div>
      <div class="modal-body">
        <div class="sub" id="responseModalSub"></div>
        <div class="response-list" id="responseList"></div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" id="closeResponseModalBtn2" type="button">閉じる</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://vspmaejoftjvooohfqbu.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZzcG1hZWpvZnRqdm9vb2hmcWJ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyODkxODQsImV4cCI6MjA5Mzg2NTE4NH0.vt33TF7OfmNHOMFUP-_Ch6TESVBPW22d-1W3LKkbrHI';

    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const PUBLIC_BASE = 'survey_public.html';

    let forms = [];
    let responseCounts = {};
    let editingId = null;
    let currentSession = null;
    let authReady = false;

    const formsBody = document.getElementById('formsBody');
    const emptyBox = document.getElementById('emptyBox');
    const tableWrap = document.getElementById('tableWrap');
    const searchInput = document.getElementById('searchInput');
    const formModalOverlay = document.getElementById('formModalOverlay');
    const responseModalOverlay = document.getElementById('responseModalOverlay');
    const questionsWrap = document.getElementById('questionsWrap');
    const authStatus = document.getElementById('authStatus');
    const responseModalTitle = document.getElementById('responseModalTitle');
    const responseModalSub = document.getElementById('responseModalSub');
    const responseList = document.getElementById('responseList');

    function uid() {
      return Math.random().toString(36).slice(2, 10);
    }

    function slugify(v) {
      return String(v || '')
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '')
        .slice(0, 40);
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2600);
    }

    function setAuthUi(isAuthed, message = '') {
      authStatus.textContent = message || (isAuthed ? '案件管理画面のログインセッションを使用中です。' : '案件管理画面でログインした状態で利用してください。');
      document.getElementById('newFormBtn').disabled = !isAuthed;
      document.getElementById('reloadBtn').disabled = !isAuthed;
      searchInput.disabled = !isAuthed;
      if (!isAuthed) {
        forms = [];
        responseCounts = {};
        formsBody.innerHTML = '';
        emptyBox.textContent = 'ログインするとアンケート一覧を表示できます。';
        emptyBox.style.display = 'block';
        tableWrap.style.display = 'none';
      }
    }

    function requireAuth() {
      if (!currentSession?.user) {
        showToast('先にログインしてください。');
        return false;
      }
      return true;
    }

    async function ensureValidSession() {
      const { data, error } = await db.auth.getUser();
      if (error || !data?.user) {
        currentSession = null;
        setAuthUi(false, 'ログイン状態が切れました。案件管理画面で再ログインしてください。');
        showToast('ログインの有効期限が切れています。再ログインしてください。');
        return false;
      }
      return true;
    }

    function fmtDateTime(value) {
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return '-';
      return d.toLocaleString('ja-JP', {
        year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'
      });
    }

    function parseQuestions(raw) {
      if (Array.isArray(raw)) return raw;
      if (!raw) return [];
      try {
        const parsed = typeof raw === 'string' ? JSON.parse(raw) : raw;
        return Array.isArray(parsed) ? parsed : [];
      } catch (_) {
        return [];
      }
    }

    function getPublicUrl(token) {
      const safe = encodeURIComponent(token || '');
      return `${location.origin}${location.pathname.replace(/[^/]+$/, '')}${PUBLIC_BASE}?token=${safe}`;
    }

    function renderRows() {
      const q = searchInput.value.toLowerCase().trim();
      const list = forms.filter(f => !q || (f.title || '').toLowerCase().includes(q));

      if (!list.length) {
        tableWrap.style.display = 'none';
        emptyBox.style.display = 'block';
        formsBody.innerHTML = '';
        return;
      }

      tableWrap.style.display = 'block';
      emptyBox.style.display = 'none';

      formsBody.innerHTML = list.map(form => {
        const published = !!form.is_published;
        const count = responseCounts[form.id] || 0;
        const questions = parseQuestions(form.questions_json);
        const publicUrl = getPublicUrl(form.public_token);
        return `
          <tr>
            <td>${form.id}</td>
            <td>
              <strong>${form.title}</strong><br>
              <span style="font-size:12px;color:var(--sub)">${form.intro_text || ''}</span>
              <div class="public-url">
                <span>公開URL:</span>
                <code>${publicUrl}</code>
                <button class="mini" type="button" onclick="copyPublicUrl('${publicUrl}')">コピー</button>
              </div>
            </td>
            <td><span class="badge ${published ? 'badge-open' : 'badge-stop'}">${published ? '公開' : '停止'}</span></td>
            <td>${questions.length}</td>
            <td>${count}</td>
            <td>${fmtDateTime(form.created_at)}</td>
            <td>
              <div class="actions">
                <button class="mini" onclick="openEdit(${form.id})">編集</button>
                <a class="mini" href="${publicUrl}" target="_blank" rel="noopener noreferrer">公開ページ</a>
                <button class="mini" onclick="openResponses(${form.id})">回答一覧</button>
              </div>
            </td>
          </tr>`;
      }).join('');
    }

    function renderAnswerValue(questionMap, questionId, value) {
      const question = questionMap.get(questionId) || { label: questionId, description: '' };
      const text = value == null || value === '' ? '—' : String(value);
      return `
        <div class="response-item">
          <div class="response-item-label">${question.label}</div>
          ${question.description ? `<div class="response-item-description" style="font-size:12px;color:var(--sub);margin-bottom:4px;white-space:pre-wrap;">${question.description}</div>` : ''}
          <div class="response-item-value">${text}</div>
        </div>`;
    }

    function buildQuestionMap(questions) {
      const map = new Map();
      questions.forEach(q => {
        map.set(q.id, {
          label: q.label || q.id,
          description: q.description || '',
        });
      });
      return map;
    }

    function questionTemplate(question = {}) {
      const qid = question.id || uid();
      const type = question.type || 'text';
      const label = question.label || '';
      const description = question.description || '';
      const required = question.required ? 'checked' : '';
      const options = (question.options || []).join('\n');
      return `
        <div class="question-box" data-qid="${qid}">
          <div class="question-head">
            <span>設問</span>
            <button class="btn btn-danger" type="button" onclick="removeQuestion('${qid}')">削除</button>
          </div>
          <div class="field">
            <label>設問文</label>
            <input type="text" class="q-label" value="${label.replace(/"/g, '&quot;')}" placeholder="例: 担当者の対応は丁寧でしたか？" />
          </div>
          <div class="field">
            <label>説明文</label>
            <textarea class="q-description question-desc" placeholder="回答者に表示する説明文を入力してください">${description}</textarea>
          </div>
          <div class="row">
            <div class="field">
              <label>入力タイプ</label>
              <select class="q-type" onchange="toggleOptions('${qid}')">
                <option value="text" ${type === 'text' ? 'selected' : ''}>1行テキスト</option>
                <option value="textarea" ${type === 'textarea' ? 'selected' : ''}>複数行テキスト</option>
                <option value="select" ${type === 'select' ? 'selected' : ''}>選択肢（プルダウン）</option>
                <option value="radio" ${type === 'radio' ? 'selected' : ''}>選択肢（ラジオ）</option>
              </select>
            </div>
            <div class="field">
              <label>必須</label>
              <select class="q-required">
                <option value="true" ${required ? 'selected' : ''}>必須</option>
                <option value="false" ${required ? '' : 'selected'}>任意</option>
              </select>
            </div>
          </div>
          <div class="field question-options ${type === 'select' || type === 'radio' ? 'show' : ''}">
            <label>選択肢（1行に1項目）</label>
            <textarea class="q-options" placeholder="とても満足\n満足\n普通\n不満\nとても不満">${options}</textarea>
          </div>
        </div>`;
    }

    function setQuestionList(questions) {
      questionsWrap.innerHTML = '';
      if (!questions.length) {
        questionsWrap.innerHTML = questionTemplate();
        return;
      }
      questions.forEach(q => {
        questionsWrap.insertAdjacentHTML('beforeend', questionTemplate(q));
      });
    }

    function collectQuestions() {
      const boxes = [...questionsWrap.querySelectorAll('.question-box')];
      const questions = boxes.map(box => {
        const id = box.dataset.qid;
        const label = box.querySelector('.q-label').value.trim();
        const description = box.querySelector('.q-description').value.trim();
        const type = box.querySelector('.q-type').value;
        const required = box.querySelector('.q-required').value === 'true';
        const optionsRaw = box.querySelector('.q-options')?.value || '';
        const options = optionsRaw
          .split('\n')
          .map(v => v.trim())
          .filter(Boolean);
        return { id, label, description, type, required, options };
      });

      for (const q of questions) {
        if (!q.label) {
          return { error: '設問文が空の項目があります。' };
        }
        if ((q.type === 'select' || q.type === 'radio') && q.options.length < 2) {
          return { error: '選択肢タイプの設問は2つ以上の選択肢が必要です。' };
        }
      }
      return { questions };
    }

    function openFormModal(isNew = true) {
      document.getElementById('formModalTitle').textContent = isNew ? '新規アンケート作成' : 'アンケート編集';
      formModalOverlay.classList.add('open');
    }

    function closeFormModal() {
      formModalOverlay.classList.remove('open');
    }

    function resetFormModal() {
      editingId = null;
      document.getElementById('fTitle').value = '';
      document.getElementById('fIntro').value = '';
      document.getElementById('fPublished').value = 'true';
      document.getElementById('fToken').value = '';
      setQuestionList([]);
    }

    async function loadForms() {
      if (!requireAuth()) return;
      if (!(await ensureValidSession())) return;
      const { data, error } = await db
        .from('survey_forms')
        .select('id,title,intro_text,is_published,public_token,questions_json,created_at')
        .order('id', { ascending: false });
      if (error) {
        showToast('アンケート読込に失敗: ' + error.message);
        return;
      }
      forms = data || [];
      await loadResponseCounts();
      renderRows();
    }

    async function loadResponseCounts() {
      const { data, error } = await db
        .from('survey_responses')
        .select('form_id');
      responseCounts = {};
      if (error) {
        showToast('回答件数読込に失敗: ' + error.message);
        return;
      }
      (data || []).forEach(r => {
        const id = r.form_id;
        responseCounts[id] = (responseCounts[id] || 0) + 1;
      });
    }

    async function openResponses(formId) {
      if (!requireAuth()) return;
      if (!(await ensureValidSession())) return;
      const form = forms.find(x => x.id === formId);
      if (!form) return;

      const questions = parseQuestions(form.questions_json);
      const questionMap = buildQuestionMap(questions);
      responseModalTitle.textContent = `回答一覧: ${form.title || 'アンケート'}`;
      responseModalSub.textContent = `公開URL: ${getPublicUrl(form.public_token)}`;
      responseList.innerHTML = '<div class="empty" style="margin:0">読み込み中...</div>';
      responseModalOverlay.classList.add('open');

      const { data, error } = await db
        .from('survey_responses')
        .select('id,respondent_name,answers_json,submitted_at,client_meta')
        .eq('form_id', formId)
        .order('submitted_at', { ascending: false });

      if (error) {
        responseList.innerHTML = `<div class="empty" style="margin:0">回答取得に失敗しました: ${error.message}</div>`;
        return;
      }

      const list = data || [];
      if (!list.length) {
        responseList.innerHTML = '<div class="empty" style="margin:0">まだ回答はありません。</div>';
        return;
      }

      responseList.innerHTML = list.map((item, index) => {
        const answers = item.answers_json || {};
        const itemsHtml = Object.entries(answers).map(([questionId, value]) => renderAnswerValue(questionMap, questionId, value)).join('');
        return `
          <div class="response-card">
            <div class="response-head">
              <strong>回答 ${list.length - index}</strong>
              <span class="response-meta">${fmtDateTime(item.submitted_at)} / ${item.respondent_name || '匿名'}</span>
            </div>
            <div class="response-items">
              ${itemsHtml || '<div class="empty" style="margin:0">回答内容がありません。</div>'}
            </div>
          </div>`;
      }).join('');
    }

    async function saveForm() {
      if (!requireAuth()) return;
      if (!(await ensureValidSession())) return;
      const title = document.getElementById('fTitle').value.trim();
      const intro = document.getElementById('fIntro').value.trim();
      const isPublished = document.getElementById('fPublished').value === 'true';
      const rawToken = document.getElementById('fToken').value.trim();
      let token = rawToken.toLowerCase();

      if (!title) {
        showToast('タイトルは必須です。');
        return;
      }

      if (!token) {
        token = slugify(title) || `survey-${uid()}`;
      }

      if (rawToken && !/^[a-z0-9-]{3,60}$/.test(rawToken)) {
        showToast('公開トークンは英小文字・数字・ハイフンで3-60文字です。');
        return;
      }

      if (!/^[a-z0-9-]{3,60}$/.test(token)) {
        token = `survey-${uid()}`;
      }

      const picked = collectQuestions();
      if (picked.error) {
        showToast(picked.error);
        return;
      }

      const payload = {
        title,
        intro_text: intro,
        is_published: isPublished,
        public_token: token,
        questions_json: picked.questions,
        updated_at: new Date().toISOString(),
      };

      let error;
      if (editingId) {
        ({ error } = await db.from('survey_forms').update(payload).eq('id', editingId));
      } else {
        ({ error } = await db.from('survey_forms').insert([payload]));
      }

      if (error) {
        if ((error.message || '').toLowerCase().includes('permission denied')) {
          currentSession = null;
          setAuthUi(false, '保存権限がありません。案件管理画面で再ログインしてください。');
          showToast('ログイン状態を確認できません。案件管理画面で再ログインしてください。');
          return;
        }
        showToast('保存に失敗: ' + error.message);
        return;
      }

      showToast('アンケートを保存しました。');
      closeFormModal();
      await loadForms();
    }

    window.openEdit = function (id) {
      const form = forms.find(x => x.id === id);
      if (!form) return;
      editingId = id;
      document.getElementById('fTitle').value = form.title || '';
      document.getElementById('fIntro').value = form.intro_text || '';
      document.getElementById('fPublished').value = form.is_published ? 'true' : 'false';
      document.getElementById('fToken').value = form.public_token || '';
      setQuestionList(parseQuestions(form.questions_json));
      openFormModal(false);
    };

    window.removeQuestion = function (qid) {
      const box = questionsWrap.querySelector(`[data-qid="${qid}"]`);
      if (!box) return;
      box.remove();
      if (!questionsWrap.children.length) {
        questionsWrap.innerHTML = questionTemplate();
      }
    };

    window.toggleOptions = function (qid) {
      const box = questionsWrap.querySelector(`[data-qid="${qid}"]`);
      if (!box) return;
      const type = box.querySelector('.q-type').value;
      const optionsBox = box.querySelector('.question-options');
      optionsBox.classList.toggle('show', type === 'select' || type === 'radio');
    };

    window.copyPublicUrl = async function (url) {
      try {
        await navigator.clipboard.writeText(url);
        showToast('公開URLをコピーしました。');
      } catch (_) {
        showToast('URLコピーに失敗しました。');
      }
    };

    document.getElementById('newFormBtn').addEventListener('click', () => {
      if (!requireAuth()) return;
      resetFormModal();
      openFormModal(true);
    });
    document.getElementById('reloadBtn').addEventListener('click', loadForms);
    document.getElementById('searchInput').addEventListener('input', renderRows);
    document.getElementById('addQuestionBtn').addEventListener('click', () => {
      questionsWrap.insertAdjacentHTML('beforeend', questionTemplate());
    });
    document.getElementById('saveFormBtn').addEventListener('click', saveForm);
    document.getElementById('closeFormModalBtn').addEventListener('click', closeFormModal);
    document.getElementById('cancelFormBtn').addEventListener('click', closeFormModal);
    formModalOverlay.addEventListener('click', (event) => {
      if (event.target === formModalOverlay) closeFormModal();
    });
    document.getElementById('closeResponseModalBtn').addEventListener('click', () => responseModalOverlay.classList.remove('open'));
    document.getElementById('closeResponseModalBtn2').addEventListener('click', () => responseModalOverlay.classList.remove('open'));
    responseModalOverlay.addEventListener('click', (event) => {
      if (event.target === responseModalOverlay) responseModalOverlay.classList.remove('open');
    });
    db.auth.getSession().then(({ data }) => {
      currentSession = data.session || null;
      authReady = true;
      setAuthUi(!!currentSession, currentSession?.user?.email ? `ログイン中: ${currentSession.user.email}` : '案件管理画面でログインした状態で利用してください。');
      if (currentSession) {
        loadForms();
      }
    });

    db.auth.onAuthStateChange((_event, session) => {
      currentSession = session;
      if (!authReady) return;
      setAuthUi(!!session, session?.user?.email ? `ログイン中: ${session.user.email}` : '案件管理画面でログインした状態で利用してください。');
      if (session) {
        loadForms();
      }
    });

    setAuthUi(false);
  </script>
</body>
</html>
