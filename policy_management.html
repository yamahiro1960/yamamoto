<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>政策管理ボード</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #f4f6fb;
      --surface: #ffffff;
      --ink: #1f2937;
      --muted: #6b7280;
      --line: #dbe1ea;
      --primary: #0f766e;
      --primary-soft: #ccfbf1;
      --accent: #0ea5e9;
      --danger: #dc2626;
      --warn: #d97706;
      --radius: 12px;
    }
    body {
      margin: 0;
      font-family: "Yu Gothic UI", "Hiragino Sans", sans-serif;
      background:
        radial-gradient(1200px 500px at 80% -10%, #d1fae5 0%, transparent 60%),
        radial-gradient(1000px 420px at -10% 0%, #dbeafe 0%, transparent 50%),
        var(--bg);
      color: var(--ink);
    }
    .layout {
      max-width: 1320px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 20px;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 16px;
    }
    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 10px 28px rgba(2, 6, 23, 0.04);
    }
    .left {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .left-head {
      padding: 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .left-head h1 {
      font-size: 18px;
      margin: 0;
      letter-spacing: 0.02em;
    }
    .left-tools {
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      display: grid;
      gap: 8px;
    }
    .policy-list {
      padding: 8px;
      overflow: auto;
      display: grid;
      gap: 8px;
      align-content: start;
      max-height: calc(100vh - 260px);
    }
    .policy-item {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      cursor: pointer;
      background: #fff;
      transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
    }
    .policy-item:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(2, 6, 23, 0.08);
    }
    .policy-item.active {
      border-color: #14b8a6;
      background: #f0fdfa;
    }
    .policy-title {
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 4px;
    }
    .policy-sub {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .right {
      padding: 16px;
      overflow: auto;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }
    .topbar h2 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 0.01em;
    }
    .save-state {
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--muted);
      background: #fff;
    }
    .save-state[data-state="dirty"] { background: #fff7ed; color: #9a3412; border-color: #fed7aa; }
    .save-state[data-state="saving"] { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
    .save-state[data-state="saved"] { background: #ecfdf5; color: #166534; border-color: #86efac; }
    .save-state[data-state="error"] { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
    .retry-save-btn {
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid #fecaca;
      background: #fff;
      color: #b91c1c;
      cursor: pointer;
    }
    .retry-save-btn.hidden { display: none; }
    .row {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 10px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .card h3 {
      margin: 0 0 12px;
      font-size: 15px;
      border-left: 4px solid #14b8a6;
      padding-left: 8px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(120px, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }
    .stat {
      border: 1px dashed #a7f3d0;
      border-radius: 10px;
      padding: 10px;
      background: #f0fdfa;
    }
    .stat .label {
      font-size: 12px;
      color: #0f766e;
    }
    .stat .value {
      font-size: 24px;
      font-weight: 700;
      margin-top: 4px;
    }

    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      font: inherit;
      font-size: 14px;
      padding: 9px 10px;
      background: #fff;
      color: var(--ink);
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #14b8a6;
      box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.14);
    }
    textarea { min-height: 90px; resize: vertical; }

    .field-3 { grid-column: span 3; }
    .field-4 { grid-column: span 4; }
    .field-6 { grid-column: span 6; }
    .field-8 { grid-column: span 8; }
    .field-12 { grid-column: span 12; }

    .btn {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: #f8fafc; }
    .btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .btn-primary:hover { background: #0d6a63; }
    .btn-soft {
      background: var(--primary-soft);
      color: #0f766e;
      border-color: #99f6e4;
    }
    .btn-danger {
      background: #fff5f5;
      color: #b91c1c;
      border-color: #fecaca;
    }

    .list-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      gap: 8px;
      flex-wrap: wrap;
    }
    .hint {
      font-size: 12px;
      color: var(--muted);
      margin: 2px 0 8px;
    }
    .mini-list {
      display: grid;
      gap: 8px;
    }
    .mini-row {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px;
      background: #fff;
    }
    .mini-row .row { align-items: end; }
    .divider {
      height: 1px;
      background: var(--line);
      margin: 10px 0;
    }
    .footnote {
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
    }

    @media (max-width: 1100px) {
      .layout { grid-template-columns: 1fr; }
      .policy-list { max-height: 240px; }
      .stats { grid-template-columns: repeat(2, minmax(120px, 1fr)); }
    }
    @media (max-width: 768px) {
      .layout { padding: 10px; gap: 10px; }
      .left-body { overflow: hidden; max-height: 0; transition: max-height .3s ease; }
      .left.expanded .left-body { max-height: 600px; }
      .left-toggle-btn {
        background: none;
        border: none;
        font-size: 18px;
        cursor: pointer;
        color: var(--text);
        padding: 4px 8px;
        border-radius: 6px;
        transition: background .15s;
      }
      .left-toggle-btn:hover { background: var(--bg); }
    }
    @media (min-width: 769px) {
      .left-toggle-btn { display: none; }
      .left-body { display: contents; }
    }
    @media (max-width: 700px) {
      .field-3, .field-4, .field-6, .field-8, .field-12 { grid-column: span 12; }
      .topbar h2 { font-size: 18px; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <section class="panel left" id="leftPanel">
      <div class="left-head">
        <h1>政策管理</h1>
        <div style="display:flex;align-items:center;gap:6px;">
          <button class="btn btn-soft" id="addPolicyBtn">+ 新規</button>
          <button class="left-toggle-btn" id="leftToggleBtn" title="一覧を開閉">▼</button>
        </div>
      </div>
      <div class="left-body">
        <div class="left-tools">
          <input id="policySearch" type="text" placeholder="政策名・カテゴリで検索" />
          <button class="btn" id="backToCasesBtn">案件管理へ戻る</button>
        </div>
        <div class="policy-list" id="policyList"></div>
      </div>
    </section>

    <main class="panel right">
      <div class="topbar">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
          <h2 id="currentPolicyTitle">政策を選択してください</h2>
          <span class="save-state" id="saveState" data-state="saved">保存済み</span>
          <button class="retry-save-btn hidden" id="retrySaveBtn" type="button">再試行</button>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn" id="exportBtn">JSON出力</button>
          <button class="btn" id="importBtn">JSON取込</button>
          <button class="btn btn-primary" id="savePolicyBtn">保存</button>
        </div>
      </div>

      <div class="stats">
        <div class="stat"><div class="label">政策数</div><div class="value" id="statPolicies">0</div></div>
        <div class="stat"><div class="label">資料件数</div><div class="value" id="statLaws">0</div></div>
        <div class="stat"><div class="label">関係者数</div><div class="value" id="statPeople">0</div></div>
        <div class="stat"><div class="label">実行タスク</div><div class="value" id="statActions">0</div></div>
      </div>

      <section class="card">
        <h3>基本情報</h3>
        <div class="row">
          <div class="field-6">
            <label>政策名</label>
            <input id="fTitle" type="text" placeholder="例: 子育て支援の拡充" />
          </div>
          <div class="field-3">
            <label>カテゴリ</label>
            <select id="fCategory">
              <option>福祉</option>
              <option>教育</option>
              <option>防災</option>
              <option>産業</option>
              <option>環境</option>
              <option>交通</option>
              <option>地域振興</option>
              <option>その他</option>
            </select>
          </div>
          <div class="field-3">
            <label>進捗フェーズ</label>
            <select id="fStage">
              <option>構想</option>
              <option>調査</option>
              <option>素案作成</option>
              <option>調整中</option>
              <option>決裁待ち</option>
              <option>実施中</option>
            </select>
          </div>
          <div class="field-3">
            <label>優先度</label>
            <select id="fPriority">
              <option>高</option>
              <option selected>中</option>
              <option>低</option>
            </select>
          </div>
          <div class="field-3">
            <label>責任者</label>
            <input id="fOwner" type="text" placeholder="例: 企画課 山本" />
          </div>
          <div class="field-3">
            <label>目標期限</label>
            <input id="fTargetDate" type="date" />
          </div>
          <div class="field-3">
            <label>予算感(円)</label>
            <input id="fBudget" type="number" min="0" step="10000" placeholder="例: 5000000" />
          </div>
          <div class="field-12">
            <label>やりたいこと(政策の目的・実現したい姿)</label>
            <textarea id="fGoal" placeholder="誰にどのような変化をもたらしたいか、できるだけ具体的に記入"></textarea>
          </div>
          <div class="field-12">
            <label>要点まとめ(調査資料を踏まえた暫定結論)</label>
            <textarea id="fSummary" placeholder="資料を整理して、判断材料を短くまとめる"></textarea>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="list-head">
          <h3 style="margin:0">条例・法令・参考資料</h3>
          <button class="btn btn-soft" id="addLawBtn">+ 資料を追加</button>
        </div>
        <p class="hint">条例、法令、ガイドライン、議事録、他自治体事例などを登録できます。</p>
        <div class="mini-list" id="lawsList"></div>
      </section>

      <section class="card">
        <div class="list-head">
          <h3 style="margin:0">実行タスク(やること)</h3>
          <button class="btn btn-soft" id="addActionBtn">+ タスクを追加</button>
        </div>
        <p class="hint">調査、会議設定、試算作成、ヒアリングなどの進行タスクを管理します。</p>
        <div class="mini-list" id="actionsList"></div>
      </section>

      <section class="card">
        <div class="list-head">
          <h3 style="margin:0">関係者</h3>
          <button class="btn btn-soft" id="addPersonBtn">+ 関係者を追加</button>
        </div>
        <p class="hint">関係部署、外部有識者、住民代表などを登録します。</p>
        <div class="mini-list" id="peopleList"></div>
      </section>

      <section class="card">
        <div class="list-head">
          <h3 style="margin:0">論点・リスク・懸念</h3>
          <button class="btn btn-soft" id="addRiskBtn">+ 論点を追加</button>
        </div>
        <p class="hint">実施の障壁、反対論点、予算や法令上の制約を整理します。</p>
        <div class="mini-list" id="risksList"></div>
        <div class="divider"></div>
        <label>メモ</label>
        <textarea id="fNotes" placeholder="打ち合わせメモ、次回確認事項、補足など"></textarea>
        <div class="footnote">保存データはSupabaseに保持されます。必要に応じてJSON出力でバックアップしてください。</div>
      </section>
    </main>
  </div>

  <input type="file" id="importFileInput" accept="application/json" style="display:none" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://vspmaejoftjvooohfqbu.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZzcG1hZWpvZnRqdm9vb2hmcWJ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyODkxODQsImV4cCI6MjA5Mzg2NTE4NH0.vt33TF7OfmNHOMFUP-_Ch6TESVBPW22d-1W3LKkbrHI';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const emptyPolicy = () => ({
      id: null,
      title: '新しい政策',
      category: '福祉',
      stage: '構想',
      priority: '中',
      owner: '',
      targetDate: '',
      budget: '',
      goal: '',
      summary: '',
      notes: '',
      laws: [],
      actions: [],
      people: [],
      risks: [],
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString(),
    });

    let state = { policies: [], selectedId: null };
    let autosaveTimer = null;
    let isSaving = false;
    let queuedAutoSave = false;

    const el = id => document.getElementById(id);

    function setSaveState(stateName, label) {
      const node = el('saveState');
      const retryBtn = el('retrySaveBtn');
      if (!node) return;
      node.dataset.state = stateName;
      node.textContent = label;
      if (retryBtn) {
        retryBtn.classList.toggle('hidden', stateName !== 'error');
      }
    }

    function mapRowToPolicy(row, children = null) {
      return {
        id: row.id,
        title: row.title || '無題の政策',
        category: row.category || 'その他',
        stage: row.stage || '構想',
        priority: row.priority || '中',
        owner: row.owner || '',
        targetDate: row.target_date || '',
        budget: row.budget == null ? '' : row.budget,
        goal: row.goal || '',
        summary: row.summary || '',
        notes: row.notes || '',
        laws: children ? children.laws : (Array.isArray(row.laws) ? row.laws : []),
        actions: children ? children.actions : (Array.isArray(row.actions) ? row.actions : []),
        people: children ? children.people : (Array.isArray(row.people) ? row.people : []),
        risks: children ? children.risks : (Array.isArray(row.risks) ? row.risks : []),
        createdAt: row.created_at || '',
        updatedAt: row.updated_at || '',
      };
    }

    function mapPolicyToPayload(policy) {
      return {
        title: policy.title || '無題の政策',
        category: policy.category || 'その他',
        stage: policy.stage || '構想',
        priority: policy.priority || '中',
        owner: policy.owner || '',
        target_date: policy.targetDate || null,
        budget: policy.budget === '' ? null : Number(policy.budget),
        goal: policy.goal || '',
        summary: policy.summary || '',
        notes: policy.notes || '',
      };
    }

    function mapDocumentRow(row) {
      return {
        type: row.doc_type || '法令',
        name: row.name || '',
        url: row.url || '',
        note: row.note || '',
      };
    }

    function mapActionRow(row) {
      return {
        task: row.task || '',
        due: row.due || '',
        owner: row.owner || '',
        status: row.status || '未着手',
      };
    }

    function mapPersonRow(row) {
      return {
        name: row.name || '',
        role: row.role || '',
        contact: row.contact || '',
        influence: row.influence || '中',
      };
    }

    function mapRiskRow(row) {
      return {
        point: row.point || '',
        level: row.level || '中',
        response: row.response || '',
      };
    }

    function groupByPolicyId(rows) {
      const map = new Map();
      (rows || []).forEach(row => {
        if (!map.has(row.policy_id)) map.set(row.policy_id, []);
        map.get(row.policy_id).push(row);
      });
      return map;
    }

    async function loadPolicies() {
      const [projectsRes, docsRes, actionsRes, peopleRes, risksRes] = await Promise.all([
        db.from('policy_projects').select('*').order('updated_at', { ascending: false }),
        db.from('policy_documents').select('*').order('sort_order', { ascending: true }),
        db.from('policy_actions').select('*').order('sort_order', { ascending: true }),
        db.from('policy_people').select('*').order('sort_order', { ascending: true }),
        db.from('policy_risks').select('*').order('sort_order', { ascending: true }),
      ]);

      if (projectsRes.error || docsRes.error || actionsRes.error || peopleRes.error || risksRes.error) {
        setSaveState('error', '読込失敗');
        alert('政策データの取得に失敗しました');
        return;
      }

      const docsByPolicy = groupByPolicyId(docsRes.data || []);
      const actionsByPolicy = groupByPolicyId(actionsRes.data || []);
      const peopleByPolicy = groupByPolicyId(peopleRes.data || []);
      const risksByPolicy = groupByPolicyId(risksRes.data || []);

      const currentId = state.selectedId;
      state.policies = (projectsRes.data || []).map(row => {
        const children = {
          laws: (docsByPolicy.get(row.id) || []).map(mapDocumentRow),
          actions: (actionsByPolicy.get(row.id) || []).map(mapActionRow),
          people: (peopleByPolicy.get(row.id) || []).map(mapPersonRow),
          risks: (risksByPolicy.get(row.id) || []).map(mapRiskRow),
        };
        return mapRowToPolicy(row, children);
      });
      if (state.policies.some(p => p.id === currentId)) {
        state.selectedId = currentId;
      } else {
        state.selectedId = state.policies[0]?.id || null;
      }
      setSaveState('saved', '保存済み');
      renderAll();
    }

    function selectedPolicy() {
      return state.policies.find(p => p.id === state.selectedId) || null;
    }

    function renderPolicyList() {
      const box = el('policyList');
      const q = el('policySearch').value.trim().toLowerCase();
      const list = state.policies.filter(p => {
        if (!q) return true;
        return (p.title || '').toLowerCase().includes(q) || (p.category || '').toLowerCase().includes(q);
      });
      if (!list.length) {
        box.innerHTML = '<div class="hint" style="padding:8px;">該当する政策がありません</div>';
        return;
      }
      box.innerHTML = list.map(p => `
        <div class="policy-item ${p.id === state.selectedId ? 'active' : ''}" data-id="${p.id}">
          <div class="policy-title">${escapeHtml(p.title || '無題')}</div>
          <div class="policy-sub">
            <span>${escapeHtml(p.category || '')}</span>
            <span>${escapeHtml(p.stage || '')}</span>
            <span>優先:${escapeHtml(p.priority || '')}</span>
          </div>
        </div>
      `).join('');
      box.querySelectorAll('.policy-item').forEach(node => {
        node.addEventListener('click', () => {
          state.selectedId = Number(node.dataset.id);
          renderAll();
        });
      });
    }

    function renderStats() {
      const totalPolicies = state.policies.length;
      const totalLaws = state.policies.reduce((acc, p) => acc + (p.laws?.length || 0), 0);
      const totalPeople = state.policies.reduce((acc, p) => acc + (p.people?.length || 0), 0);
      const totalActions = state.policies.reduce((acc, p) => acc + (p.actions?.length || 0), 0);
      el('statPolicies').textContent = totalPolicies;
      el('statLaws').textContent = totalLaws;
      el('statPeople').textContent = totalPeople;
      el('statActions').textContent = totalActions;
    }

    function renderForm() {
      const p = selectedPolicy();
      if (!p) {
        el('currentPolicyTitle').textContent = '政策を選択してください';
        ['fTitle','fOwner','fTargetDate','fBudget','fGoal','fSummary','fNotes'].forEach(id => el(id).value = '');
        el('lawsList').innerHTML = '<div class="hint">政策を選択すると表示されます</div>';
        el('actionsList').innerHTML = '<div class="hint">政策を選択すると表示されます</div>';
        el('peopleList').innerHTML = '<div class="hint">政策を選択すると表示されます</div>';
        el('risksList').innerHTML = '<div class="hint">政策を選択すると表示されます</div>';
        return;
      }
      el('currentPolicyTitle').textContent = p.title || '無題の政策';
      el('fTitle').value = p.title || '';
      el('fCategory').value = p.category || '福祉';
      el('fStage').value = p.stage || '構想';
      el('fPriority').value = p.priority || '中';
      el('fOwner').value = p.owner || '';
      el('fTargetDate').value = p.targetDate || '';
      el('fBudget').value = p.budget || '';
      el('fGoal').value = p.goal || '';
      el('fSummary').value = p.summary || '';
      el('fNotes').value = p.notes || '';

      renderMiniList('lawsList', p.laws || [], lawRowTemplate, updateLaw, removeLaw);
      renderMiniList('actionsList', p.actions || [], actionRowTemplate, updateAction, removeAction);
      renderMiniList('peopleList', p.people || [], personRowTemplate, updatePerson, removePerson);
      renderMiniList('risksList', p.risks || [], riskRowTemplate, updateRisk, removeRisk);
    }

    function renderMiniList(containerId, data, templateFn, updateFn, removeFn) {
      const container = el(containerId);
      if (!data.length) {
        container.innerHTML = '<div class="hint">まだ登録がありません</div>';
        return;
      }
      container.innerHTML = data.map((item, idx) => templateFn(item, idx)).join('');
      container.querySelectorAll('[data-update]').forEach(node => {
        node.addEventListener('input', e => updateFn(Number(node.dataset.idx), node.dataset.key, e.target.value));
        node.addEventListener('change', e => {
          updateFn(Number(node.dataset.idx), node.dataset.key, e.target.value);
          requestAutoSave();
        });
        node.addEventListener('blur', () => {
          requestAutoSave();
        });
      });
      container.querySelectorAll('[data-remove]').forEach(node => {
        node.addEventListener('click', () => removeFn(Number(node.dataset.idx)));
      });
    }

    function lawRowTemplate(item, idx) {
      return `
        <div class="mini-row">
          <div class="row">
            <div class="field-3"><label>区分</label><input data-update data-idx="${idx}" data-key="type" value="${escapeAttr(item.type || '')}" /></div>
            <div class="field-4"><label>資料名</label><input data-update data-idx="${idx}" data-key="name" value="${escapeAttr(item.name || '')}" /></div>
            <div class="field-4"><label>URL/保存先</label><input data-update data-idx="${idx}" data-key="url" value="${escapeAttr(item.url || '')}" /></div>
            <div class="field-1"><button class="btn btn-danger" data-remove data-idx="${idx}">削除</button></div>
            <div class="field-12"><label>要点</label><input data-update data-idx="${idx}" data-key="note" value="${escapeAttr(item.note || '')}" /></div>
          </div>
        </div>
      `;
    }

    function actionRowTemplate(item, idx) {
      return `
        <div class="mini-row">
          <div class="row">
            <div class="field-5"><label>タスク</label><input data-update data-idx="${idx}" data-key="task" value="${escapeAttr(item.task || '')}" /></div>
            <div class="field-2"><label>期限</label><input type="date" data-update data-idx="${idx}" data-key="due" value="${escapeAttr(item.due || '')}" /></div>
            <div class="field-2"><label>担当</label><input data-update data-idx="${idx}" data-key="owner" value="${escapeAttr(item.owner || '')}" /></div>
            <div class="field-2"><label>状態</label><select data-update data-idx="${idx}" data-key="status">
              ${optionHtml(['未着手','進行中','完了','保留'], item.status || '未着手')}
            </select></div>
            <div class="field-1"><button class="btn btn-danger" data-remove data-idx="${idx}">削除</button></div>
          </div>
        </div>
      `;
    }

    function personRowTemplate(item, idx) {
      return `
        <div class="mini-row">
          <div class="row">
            <div class="field-3"><label>氏名/組織</label><input data-update data-idx="${idx}" data-key="name" value="${escapeAttr(item.name || '')}" /></div>
            <div class="field-3"><label>役割</label><input data-update data-idx="${idx}" data-key="role" value="${escapeAttr(item.role || '')}" /></div>
            <div class="field-3"><label>連絡先</label><input data-update data-idx="${idx}" data-key="contact" value="${escapeAttr(item.contact || '')}" /></div>
            <div class="field-2"><label>影響度</label><select data-update data-idx="${idx}" data-key="influence">
              ${optionHtml(['高','中','低'], item.influence || '中')}
            </select></div>
            <div class="field-1"><button class="btn btn-danger" data-remove data-idx="${idx}">削除</button></div>
          </div>
        </div>
      `;
    }

    function riskRowTemplate(item, idx) {
      return `
        <div class="mini-row">
          <div class="row">
            <div class="field-5"><label>論点・懸念事項</label><input data-update data-idx="${idx}" data-key="point" value="${escapeAttr(item.point || '')}" /></div>
            <div class="field-2"><label>重要度</label><select data-update data-idx="${idx}" data-key="level">
              ${optionHtml(['高','中','低'], item.level || '中')}
            </select></div>
            <div class="field-4"><label>対応策</label><input data-update data-idx="${idx}" data-key="response" value="${escapeAttr(item.response || '')}" /></div>
            <div class="field-1"><button class="btn btn-danger" data-remove data-idx="${idx}">削除</button></div>
          </div>
        </div>
      `;
    }

    function optionHtml(options, current) {
      return options.map(v => `<option ${v === current ? 'selected' : ''}>${v}</option>`).join('');
    }

    function updateSelectedBasic() {
      const p = selectedPolicy();
      if (!p) return;
      p.title = el('fTitle').value.trim() || '無題の政策';
      p.category = el('fCategory').value;
      p.stage = el('fStage').value;
      p.priority = el('fPriority').value;
      p.owner = el('fOwner').value.trim();
      p.targetDate = el('fTargetDate').value;
      p.budget = el('fBudget').value;
      p.goal = el('fGoal').value.trim();
      p.summary = el('fSummary').value.trim();
      p.notes = el('fNotes').value.trim();
      p.updatedAt = new Date().toISOString();
    }

    function requestAutoSave() {
      clearTimeout(autosaveTimer);
      setSaveState('dirty', '未保存');
      autosaveTimer = setTimeout(() => {
        void autoSavePolicy();
      }, 900);
    }

    async function autoSavePolicy() {
      if (isSaving) {
        queuedAutoSave = true;
        return;
      }
      await savePolicy(false, false);
      if (queuedAutoSave) {
        queuedAutoSave = false;
        requestAutoSave();
      }
    }

    function updateArrayItem(key, idx, field, value) {
      const p = selectedPolicy();
      if (!p || !p[key] || !p[key][idx]) return;
      p[key][idx][field] = value;
      p.updatedAt = new Date().toISOString();
      renderStats();
      renderPolicyList();
    }

    const updateLaw = (idx, field, value) => updateArrayItem('laws', idx, field, value);
    const updateAction = (idx, field, value) => updateArrayItem('actions', idx, field, value);
    const updatePerson = (idx, field, value) => updateArrayItem('people', idx, field, value);
    const updateRisk = (idx, field, value) => updateArrayItem('risks', idx, field, value);

    function removeArrayItem(key, idx) {
      const p = selectedPolicy();
      if (!p || !p[key]) return;
      p[key].splice(idx, 1);
      p.updatedAt = new Date().toISOString();
      requestAutoSave();
      renderAll();
    }

    const removeLaw = idx => removeArrayItem('laws', idx);
    const removeAction = idx => removeArrayItem('actions', idx);
    const removePerson = idx => removeArrayItem('people', idx);
    const removeRisk = idx => removeArrayItem('risks', idx);

    function addItem(key, item) {
      const p = selectedPolicy();
      if (!p) return;
      p[key].push(item);
      p.updatedAt = new Date().toISOString();
      requestAutoSave();
      renderAll();
    }

    async function replacePolicyDocuments(policyId, laws) {
      const { error: deleteError } = await db.from('policy_documents').delete().eq('policy_id', policyId);
      if (deleteError) return deleteError;
      if (!laws.length) return null;
      const rows = laws.map((x, idx) => ({
        policy_id: policyId,
        sort_order: idx,
        doc_type: x.type || '法令',
        name: x.name || '',
        url: x.url || '',
        note: x.note || '',
      }));
      const { error } = await db.from('policy_documents').insert(rows);
      return error || null;
    }

    async function replacePolicyActions(policyId, actions) {
      const { error: deleteError } = await db.from('policy_actions').delete().eq('policy_id', policyId);
      if (deleteError) return deleteError;
      if (!actions.length) return null;
      const rows = actions.map((x, idx) => ({
        policy_id: policyId,
        sort_order: idx,
        task: x.task || '',
        due: x.due || null,
        owner: x.owner || '',
        status: x.status || '未着手',
      }));
      const { error } = await db.from('policy_actions').insert(rows);
      return error || null;
    }

    async function replacePolicyPeople(policyId, people) {
      const { error: deleteError } = await db.from('policy_people').delete().eq('policy_id', policyId);
      if (deleteError) return deleteError;
      if (!people.length) return null;
      const rows = people.map((x, idx) => ({
        policy_id: policyId,
        sort_order: idx,
        name: x.name || '',
        role: x.role || '',
        contact: x.contact || '',
        influence: x.influence || '中',
      }));
      const { error } = await db.from('policy_people').insert(rows);
      return error || null;
    }

    async function replacePolicyRisks(policyId, risks) {
      const { error: deleteError } = await db.from('policy_risks').delete().eq('policy_id', policyId);
      if (deleteError) return deleteError;
      if (!risks.length) return null;
      const rows = risks.map((x, idx) => ({
        policy_id: policyId,
        sort_order: idx,
        point: x.point || '',
        level: x.level || '中',
        response: x.response || '',
      }));
      const { error } = await db.from('policy_risks').insert(rows);
      return error || null;
    }

    async function savePolicyChildren(policyId, policy) {
      const [docErr, actionErr, peopleErr, riskErr] = await Promise.all([
        replacePolicyDocuments(policyId, policy.laws || []),
        replacePolicyActions(policyId, policy.actions || []),
        replacePolicyPeople(policyId, policy.people || []),
        replacePolicyRisks(policyId, policy.risks || []),
      ]);
      return docErr || actionErr || peopleErr || riskErr || null;
    }

    async function addPolicy() {
      const item = emptyPolicy();
      const { data, error } = await db
        .from('policy_projects')
        .insert([mapPolicyToPayload(item)])
        .select('*')
        .single();
      if (error) {
        alert('新規政策の作成に失敗しました');
        return;
      }
      const created = mapRowToPolicy(data);
      state.policies.unshift(created);
      state.selectedId = created.id;
      renderAll();
    }

    async function savePolicy(showMessage = true, reloadAfterSave = true) {
      if (isSaving) {
        if (showMessage) alert('現在保存中です。少し待って再実行してください');
        return;
      }
      isSaving = true;
      setSaveState('saving', '保存中...');
      updateSelectedBasic();
      const p = selectedPolicy();
      if (!p) {
        isSaving = false;
        return;
      }
      const payload = mapPolicyToPayload(p);
      const { data, error } = await db
        .from('policy_projects')
        .update(payload)
        .eq('id', p.id)
        .select('*')
        .single();
      if (error) {
        isSaving = false;
        setSaveState('error', '保存失敗');
        if (showMessage) alert('保存に失敗しました');
        return;
      }

      const childError = await savePolicyChildren(p.id, p);
      if (childError) {
        isSaving = false;
        setSaveState('error', '保存失敗');
        if (showMessage) alert('明細データの保存に失敗しました');
        return;
      }

      const fresh = mapRowToPolicy(data);
      const idx = state.policies.findIndex(x => x.id === p.id);
      if (idx >= 0) state.policies[idx] = fresh;
      if (reloadAfterSave) {
        await loadPolicies();
      } else {
        setSaveState('saved', '保存済み');
      }
      isSaving = false;
      if (showMessage) alert('保存しました');
    }

    function exportJson() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'policy_management_backup.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    async function replaceAllPolicies(policies) {
      const { error: deleteError } = await db
        .from('policy_projects')
        .delete()
        .gte('id', 0);
      if (deleteError) {
        alert('既存データの削除に失敗しました');
        return;
      }

      if (!policies.length) {
        await loadPolicies();
        return;
      }

      for (const policy of policies) {
        const payload = mapPolicyToPayload(policy);
        const { data, error } = await db
          .from('policy_projects')
          .insert([payload])
          .select('id')
          .single();
        if (error) {
          alert('JSONの取込に失敗しました');
          return;
        }
        const childError = await savePolicyChildren(data.id, policy);
        if (childError) {
          alert('JSON明細の取込に失敗しました');
          return;
        }
      }
      await loadPolicies();
    }

    function importJson(file) {
      const reader = new FileReader();
      reader.onload = async () => {
        try {
          const parsed = JSON.parse(String(reader.result || ''));
          if (!Array.isArray(parsed.policies)) throw new Error('形式が不正です');
          await replaceAllPolicies(parsed.policies);
          alert('取込が完了しました');
        } catch (e) {
          alert('JSONの取込に失敗しました');
        }
      };
      reader.readAsText(file, 'utf-8');
    }

    function renderAll() {
      if (!selectedPolicy() && state.policies.length) {
        state.selectedId = state.policies[0].id;
      }
      renderPolicyList();
      renderStats();
      renderForm();
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/`/g, '&#96;');
    }

    el('addPolicyBtn').addEventListener('click', addPolicy);
    el('policySearch').addEventListener('input', renderPolicyList);
    el('savePolicyBtn').addEventListener('click', () => savePolicy(true));
    el('retrySaveBtn').addEventListener('click', () => savePolicy(true, false));
    el('exportBtn').addEventListener('click', exportJson);
    el('importBtn').addEventListener('click', () => el('importFileInput').click());
    el('importFileInput').addEventListener('change', e => {
      const file = e.target.files?.[0];
      if (file) importJson(file);
      e.target.value = '';
    });

    el('fTitle').addEventListener('input', () => {
      updateSelectedBasic();
      renderPolicyList();
      el('currentPolicyTitle').textContent = el('fTitle').value || '無題の政策';
    });
    el('fTitle').addEventListener('blur', () => {
      updateSelectedBasic();
      requestAutoSave();
    });
    ['fCategory','fStage','fPriority','fOwner','fTargetDate','fBudget','fGoal','fSummary','fNotes'].forEach(id => {
      const node = el(id);
      node.addEventListener('input', () => { updateSelectedBasic(); renderStats(); });
      node.addEventListener('change', () => { updateSelectedBasic(); requestAutoSave(); renderStats(); });
      if (node.tagName !== 'SELECT') {
        node.addEventListener('blur', () => { updateSelectedBasic(); requestAutoSave(); renderStats(); });
      }
    });

    el('addLawBtn').addEventListener('click', () => addItem('laws', { type: '法令', name: '', url: '', note: '' }));
    el('addActionBtn').addEventListener('click', () => addItem('actions', { task: '', due: '', owner: '', status: '未着手' }));
    el('addPersonBtn').addEventListener('click', () => addItem('people', { name: '', role: '', contact: '', influence: '中' }));
    el('addRiskBtn').addEventListener('click', () => addItem('risks', { point: '', level: '中', response: '' }));

    el('backToCasesBtn').addEventListener('click', () => {
      window.location.href = 'index.html';
    });

    loadPolicies();

    // ===== Mobile left panel toggle =====
    const leftPanel     = document.getElementById('leftPanel');
    const leftToggleBtn = document.getElementById('leftToggleBtn');
    function isMobile() { return window.innerWidth <= 768; }
    function updateToggle() {
      if (!isMobile()) return;
      const expanded = leftPanel.classList.contains('expanded');
      leftToggleBtn.textContent = expanded ? '▲' : '▼';
      leftToggleBtn.title = expanded ? '一覧を閉じる' : '一覧を開く';
    }
    leftToggleBtn.addEventListener('click', () => {
      leftPanel.classList.toggle('expanded');
      updateToggle();
    });
    window.addEventListener('resize', () => {
      if (!isMobile()) leftPanel.classList.remove('expanded');
    });
    updateToggle();
  </script>
</body>
</html>
