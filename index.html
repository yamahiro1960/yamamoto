<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>案件管理システム</title>
  <style>
    /* ===== Reset & Base ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary:    #2563eb;
      --primary-dk: #1d4ed8;
      --secondary:  #64748b;
      --success:    #16a34a;
      --warning:    #d97706;
      --danger:     #dc2626;
      --info:       #0891b2;
      --bg:         #f1f5f9;
      --surface:    #ffffff;
      --border:     #e2e8f0;
      --text:       #1e293b;
      --text-sub:   #64748b;
      --header-h:   64px;
    }
    body {
      font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
    }

    .app-hidden {
      display: none !important;
    }

    .auth-gate {
      min-height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at 10% 20%, rgba(37,99,235,.15), transparent 45%),
        radial-gradient(circle at 90% 10%, rgba(14,116,144,.16), transparent 42%),
        linear-gradient(135deg, #f8fbff 0%, #eef4ff 48%, #f7fbff 100%);
    }
    .auth-gate-card {
      width: 100%;
      max-width: 460px;
      background: #fff;
      border: 1px solid #dbeafe;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 24px 60px rgba(30, 41, 59, .12);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .auth-gate-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: .01em;
    }
    .auth-gate-sub {
      color: var(--text-sub);
      font-size: 14px;
      line-height: 1.6;
    }
    .auth-gate-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 4px;
    }
    .auth-gate-form input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      background: var(--surface);
    }
    .auth-gate-form input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37,99,235,.1);
    }
    .auth-gate-form .btn {
      justify-content: center;
      padding: 11px 14px;
      font-size: 15px;
      font-weight: 700;
    }
    .auth-gate-links {
      display: flex;
      justify-content: flex-end;
      margin-top: 2px;
    }

    /* ===== Main layout ===== */
    .main-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ===== Header ===== */
    .header {
      min-height: var(--header-h);
      height: auto;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      position: sticky; top: 0; z-index: 50;
      gap: 12px;
      flex-wrap: wrap;
    }
    .header-title { font-size: 18px; font-weight: 700; }
    .header-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
    .auth-panel {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .auth-panel input {
      width: 210px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      background: var(--surface);
    }
    .auth-panel input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
    .auth-hint {
      font-size: 12px;
      color: var(--text-sub);
      margin-left: 4px;
    }
    .auth-status {
      font-size: 12px;
      color: var(--text-sub);
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 999px;
      padding: 6px 10px;
      white-space: nowrap;
    }
    .auth-panel .hidden-auth {
      display: none !important;
    }
    .auth-link-btn {
      background: transparent;
      border: none;
      color: var(--primary);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      padding: 0 2px;
    }
    .auth-link-btn:hover {
      color: var(--primary-dk);
      text-decoration: underline;
    }
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 14px; font-weight: 500;
      border: none; cursor: pointer;
      transition: background .15s, box-shadow .15s;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dk); box-shadow: 0 2px 8px rgba(37,99,235,.3); }
    .btn-ghost { background: transparent; color: var(--text-sub); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--bg); }
    #openTimelineBtn { background: #dcfce7; color: #166534; border-color: #86efac; }
    #openTimelineBtn:hover { background: #bbf7d0; }

    /* ===== Page content ===== */
    .page { padding: 28px; flex: 1; }

    /* ===== KPI Cards ===== */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }
    .kpi-card {
      background: var(--surface);
      border-radius: 12px;
      padding: 20px;
      border: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 8px;
      transition: box-shadow .15s;
    }
    .kpi-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.08); }
    .kpi-label { font-size: 13px; color: var(--text-sub); display: flex; align-items: center; gap: 6px; }
    .kpi-value { font-size: 32px; font-weight: 700; line-height: 1; }
    .kpi-sub  { font-size: 12px; color: var(--text-sub); }
    .kpi-bar  { height: 4px; border-radius: 2px; background: var(--border); overflow: hidden; }
    .kpi-bar-fill { height: 100%; border-radius: 2px; }

    /* ===== Toolbar ===== */
    .toolbar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .search-box {
      flex: 1; min-width: 200px;
      display: flex; align-items: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      gap: 8px;
    }
    .search-box input {
      border: none; background: transparent; outline: none;
      font-size: 14px; color: var(--text); flex: 1;
    }
    .search-box input::placeholder { color: var(--text-sub); }
    .filter-select {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      font-size: 14px; color: var(--text);
      cursor: pointer; outline: none;
    }
    .filter-select:focus { border-color: var(--primary); }
    .view-switch {
      display: inline-flex;
      gap: 8px;
      align-items: center;
    }
    .view-switch .btn {
      padding: 8px 14px;
    }
    .view-switch .btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 2px 8px rgba(37,99,235,.22);
    }
    .layout-switch {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      margin-left: auto;
    }
    .layout-switch .btn {
      padding: 8px 14px;
    }
    .layout-switch .btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 2px 8px rgba(37,99,235,.22);
    }

    /* ===== Table ===== */
    .table-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .table-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .table-header h2 { font-size: 15px; font-weight: 600; }
    .count-badge {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2px 10px;
      font-size: 12px;
      color: var(--text-sub);
    }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      text-align: left;
      font-size: 12px; font-weight: 600;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: .05em;
      padding: 12px 16px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    thead th:first-child { padding-left: 20px; }
    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background .1s;
      cursor: pointer;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #f8fafc; }
    tbody tr.deleted-row {
      background: #fff7ed;
      color: #9a3412;
    }
    tbody tr.deleted-row:hover { background: #ffedd5; }
    tbody td {
      padding: 14px 16px;
      font-size: 14px;
      vertical-align: middle;
    }
    tbody td:first-child { padding-left: 20px; }
    .tile-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
      padding: 14px;
    }
    .case-tile {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      padding: 14px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: box-shadow .15s, transform .15s;
    }
    .case-tile:hover {
      box-shadow: 0 8px 20px rgba(15, 23, 42, .08);
      transform: translateY(-1px);
    }
    .case-tile.deleted {
      background: #fff7ed;
      border-color: #fdba74;
    }
    .case-tile-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }
    .case-tile-id {
      font-size: 12px;
      color: var(--text-sub);
    }
    .case-tile-name {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.35;
    }
    .case-tile-meta {
      display: grid;
      grid-template-columns: 92px 1fr;
      gap: 6px 10px;
      font-size: 13px;
      color: var(--text);
    }
    .case-tile-meta dt {
      color: var(--text-sub);
      font-weight: 600;
    }
    .case-tile-meta dd {
      margin: 0;
      min-width: 0;
      word-break: break-word;
    }
    .case-tile-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      border-top: 1px solid var(--border);
      padding-top: 8px;
      margin-top: 2px;
    }
    .tile-empty {
      border: 1px dashed var(--border);
      border-radius: 10px;
      color: var(--text-sub);
      text-align: center;
      padding: 28px 12px;
      margin: 14px;
      font-size: 14px;
    }

    /* ===== Status badges ===== */
    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px; font-weight: 500;
      white-space: nowrap;
    }
    .badge-dot { width: 6px; height: 6px; border-radius: 50%; }
    .badge-inprogress  { background: #dbeafe; color: #1d4ed8; }
    .badge-inprogress  .badge-dot { background: #2563eb; }
    .badge-completed   { background: #dcfce7; color: #15803d; }
    .badge-completed   .badge-dot { background: #16a34a; }
    .badge-pending     { background: #fef9c3; color: #a16207; }
    .badge-pending     .badge-dot { background: #ca8a04; }
    .badge-cancelled   { background: #fee2e2; color: #b91c1c; }
    .badge-cancelled   .badge-dot { background: #dc2626; }
    .badge-new         { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
    .badge-new         .badge-dot { background: #22c55e; }
    .badge-deleted     { background: #fff7ed; color: #9a3412; border: 1px solid #fdba74; }
    .badge-deleted     .badge-dot { background: #ea580c; }

    /* Priority */
    .priority { font-size: 13px; font-weight: 600; }
    .priority-high   { color: var(--danger); }
    .priority-medium { color: var(--warning); }
    .priority-low    { color: var(--success); }

    /* ===== Action menu ===== */
    .action-btn {
      background: transparent; border: none; cursor: pointer;
      color: var(--text-sub); font-size: 18px; padding: 4px 8px;
      border-radius: 6px; line-height: 1;
    }
    .action-btn:hover { background: var(--bg); color: var(--text); }
    .action-btn-active { color: var(--primary) !important; }
    .action-btn-inactive { opacity: .3; cursor: default !important; }
    .action-btn-inactive:hover { background: transparent !important; }

    /* ===== Viewer Overlay ===== */
    #viewerOverlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.78);
      display: flex; align-items: center; justify-content: center;
      z-index: 1100;
      visibility: hidden; opacity: 0;
      transition: opacity .2s, visibility .2s;
    }
    #viewerOverlay.open { visibility: visible; opacity: 1; }
    .viewer-box {
      background: #fff;
      border-radius: 12px;
      max-width: 92vw; max-height: 92vh;
      width: 760px;
      display: flex; flex-direction: column;
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(0,0,0,.5);
    }
    .viewer-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      background: var(--surface);
    }
    .viewer-head h3 { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 90%; }
    .viewer-body {
      flex: 1; overflow: auto;
      display: flex; align-items: center; justify-content: center;
      background: #111;
      min-height: 200px;
    }
    .viewer-body img { max-width: 100%; max-height: 80vh; object-fit: contain; display: block; }
    .viewer-body iframe { width: 100%; height: 72vh; border: none; display: block; }
    .viewer-body.doc-view { background: #f8fafc; }
    .viewer-open-link {
      display: inline-flex; align-items: center; gap: 6px;
      margin: 16px; padding: 10px 20px;
      background: var(--primary); color: #fff;
      border-radius: 8px; text-decoration: none; font-size: 14px; font-weight: 600;
    }
    .viewer-open-link:hover { background: var(--primary-dk); }

    /* ===== Pagination ===== */
    .pagination {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      font-size: 13px; color: var(--text-sub);
    }
    .page-btns { display: flex; gap: 4px; }
    .page-btn {
      width: 32px; height: 32px;
      border: 1px solid var(--border);
      border-radius: 6px; background: var(--surface);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 13px;
      transition: background .1s;
    }
    .page-btn:hover { background: var(--bg); }
    .page-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    /* ===== Modal ===== */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.45);
      display: flex; align-items: center; justify-content: center;
      z-index: 200;
      opacity: 0; pointer-events: none;
      transition: opacity .2s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }
    .modal {
      background: var(--surface);
      border-radius: 16px;
      width: 560px; max-width: 95vw;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
      transform: translateY(20px);
      transition: transform .2s;
    }
    .modal-overlay.open .modal { transform: translateY(0); }
    .modal-head {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .modal-head h3 { font-size: 17px; font-weight: 700; }
    .close-btn {
      width: 32px; height: 32px; border-radius: 8px;
      border: none; background: var(--bg); cursor: pointer;
      font-size: 18px; display: flex; align-items: center; justify-content: center;
    }
    .close-btn:hover { background: var(--border); }
    .modal-body { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 13px; font-weight: 600; color: var(--text); }
    .form-group input,
    .form-group select,
    .form-group textarea {
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px; font-family: inherit;
      outline: none; transition: border-color .15s;
      background: var(--surface);
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
    .form-group textarea { resize: vertical; min-height: 80px; }
    .photo-field {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .photo-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .photo-preview {
      display: none;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #f8fafc;
      padding: 10px;
      gap: 10px;
      align-items: flex-start;
    }
    .photo-preview.has-image {
      display: flex;
    }
    .photo-preview img {
      width: 128px;
      max-width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #fff;
    }
    .photo-preview-text {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12px;
      color: var(--text-sub);
    }
    .photo-thumb-link {
      display: inline-flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-start;
      text-decoration: none;
      color: var(--primary);
      font-size: 13px;
      font-weight: 600;
    }
    .photo-thumb-link img {
      width: 120px;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #fff;
    }
    .modal-foot {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      display: flex; justify-content: flex-end; gap: 12px;
    }
    .modal-foot .btn {
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 600;
    }
    .sub-modal {
      width: 860px;
      max-width: 96vw;
    }
    .timeline-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 16px;
      align-items: start;
    }
    .timeline-form,
    .timeline-list {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #f8fafc;
      padding: 14px;
    }
    .timeline-list {
      max-height: 56vh;
      overflow-y: auto;
      background: var(--surface);
    }
    .timeline-title {
      font-size: 13px;
      color: var(--text-sub);
      margin-bottom: 10px;
      font-weight: 600;
    }
    .timeline-item {
      border-left: 3px solid #bfdbfe;
      padding: 10px 12px;
      margin-bottom: 10px;
      background: #f8fafc;
      border-radius: 8px;
    }
    .timeline-item.deleted {
      opacity: .84;
      border-left-color: #fdba74;
      background: #fff7ed;
    }
    .timeline-item-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .timeline-item-title { font-weight: 700; font-size: 14px; }
    .timeline-meta { font-size: 12px; color: var(--text-sub); }
    .timeline-item-detail { font-size: 13px; line-height: 1.5; white-space: pre-wrap; }
    .timeline-links {
      margin-top: 8px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .timeline-links a {
      font-size: 12px;
      color: #1d4ed8;
      flex-wrap: wrap;
      text-decoration: none;
      border: 1px solid #bfdbfe;
      background: #eff6ff;
      padding: 4px 8px;
      border-radius: 999px;
    }
    .timeline-links a:hover { background: #dbeafe; }
    .work-status {
      font-size: 11px;
      font-weight: 700;
      border-radius: 999px;
      padding: 2px 8px;
      white-space: nowrap;
    }
    .work-status-notstarted { background: #f1f5f9; color: #475569; }
    .work-status-progress { background: #dbeafe; color: #1d4ed8; }
    .work-status-done { background: #dcfce7; color: #15803d; }
    .work-status-hold { background: #fef9c3; color: #a16207; }
    .map-preview {
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      background: var(--surface);
    }
    .map-preview iframe {
      width: 100%;
      height: 220px;
      border: 0;
      display: block;
    }
    .map-preview-actions {
      padding: 10px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      background: #f8fafc;
    }
    .timeline-empty {
      text-align: center;
      color: var(--text-sub);
      font-size: 13px;
      padding: 24px 10px;
      border: 1px dashed var(--border);
      border-radius: 10px;
    }

<script>

  const SUPABASE_URL      = 'https://vspmaejoftjvooohfqbu.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZzcG1hZWpvZnRqdm9vb2hmcWJ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyODkxODQsImV4cCI6MjA5Mzg2NTE4NH0.vt33TF7OfmNHOMFUP-_Ch6TESVBPW22d-1W3LKkbrHI';

  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const PHOTO_BUCKET = 'case-photos';
  const SHARED_SESSION_KEY = 'yamamoto_shared_session_v1';

  // ===== State =====
  let cases = [];

  let editingId = null;
  let timelineCaseId = null;
  const PAGE_SIZE = 100;
  let currentPage = 1;
  let workViewMode = 'active';
  let listLayoutMode = 'table';

  const pendingPhotoUploads = { f: null, t: null };

  // ===== Helpers =====
  const statusClass  = { '進行中': 'inprogress', '完了': 'completed', '保留': 'pending', 'キャンセル': 'cancelled', '新規': 'new' };
  const priorityClass = { '高': 'high', '中': 'medium', '低': 'low' };
  const workStatusClass = { '未着手': 'notstarted', '進行中': 'progress', '完了': 'done', '保留': 'hold' };

  function statusBadge(s) {
    const cls = statusClass[s] || 'inprogress';
    return `<span class="badge badge-${cls}"><span class="badge-dot"></span>${s}</span>`;
  }
  function deletedBadge(label = '削除待ち') {
    return `<span class="badge badge-deleted"><span class="badge-dot"></span>${label}</span>`;
  }
  function priorityBadge(p) {
    const cls = priorityClass[p] || 'medium';
    return `<span class="priority priority-${cls}">${p === '高' ? '▲ 高' : p === '中' ? '─ 中' : '▽ 低'}</span>`;
  }
  function fmtId(id) {
    return 'A-' + String(id).padStart(3, '0');
  }
  function makePhotoFileName(name = 'photo.jpg') {
    const safe = String(name || 'photo.jpg').replace(/[^a-zA-Z0-9._-]/g, '-');
    return safe.toLowerCase().endsWith('.jpg') || safe.toLowerCase().endsWith('.jpeg')
      ? safe
      : `${safe.replace(/\.[^.]+$/, '') || 'photo'}.jpg`;
  }
  function buildPhotoStoragePath(prefix, fileName) {
    const folder = prefix === 'f' ? 'cases' : 'activities';
    const ownerId = prefix === 'f' ? (editingId || 'new') : (timelineCaseId || 'new');
    const stamp = new Date().toISOString().replace(/[^0-9]/g, '').slice(0, 14);
    const random = Math.random().toString(36).slice(2, 8);
    return `${folder}/${ownerId}/${stamp}-${random}-${fileName}`;
  }
  function getPhotoFieldRefs(prefix) {
    return {
      hidden: document.getElementById(prefix + 'PhotoUrl'),
      file: document.getElementById(prefix + 'PhotoFile'),
      preview: document.getElementById(prefix + 'PhotoPreview'),
      img: document.getElementById(prefix + 'PhotoPreviewImg'),
      meta: document.getElementById(prefix + 'PhotoPreviewMeta'),
      link: document.getElementById(prefix + 'PhotoPreviewLink'),
    };
  }
  function formatBytes(bytes) {
    if (!Number.isFinite(bytes) || bytes <= 0) return '0 B';
    if (bytes < 1024) return `${bytes} B`;
    if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
    return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
  }
  function dataUrlBytes(dataUrl) {
    if (!(dataUrl || '').startsWith('data:')) return 0;
    const base64 = (dataUrl || '').split(',')[1] || '';
    return Math.ceil((base64.length * 3) / 4);
  }
  function clearPendingPhoto(prefix) {
    pendingPhotoUploads[prefix] = null;
  }
  function extractStoragePath(photoUrl) {
    const marker = `/storage/v1/object/public/${PHOTO_BUCKET}/`;
    const idx = (photoUrl || '').indexOf(marker);
    if (idx === -1) return '';
    return decodeURIComponent(photoUrl.slice(idx + marker.length).split('?')[0]);
  }
  async function removeStoredPhotos(photoUrls) {
    const paths = [...new Set((photoUrls || []).map(extractStoragePath).filter(Boolean))];
    if (!paths.length) return;
    const { error } = await db.storage.from(PHOTO_BUCKET).remove(paths);
    if (error) {
      throw new Error('写真ファイルの削除に失敗しました: ' + error.message);
    }
  }
  function setPhotoPreview(prefix, dataUrl, metaText = '') {
    const refs = getPhotoFieldRefs(prefix);
    refs.hidden.value = dataUrl || '';
    refs.file.value = '';
    if (!dataUrl) {
      clearPendingPhoto(prefix);
      refs.preview.classList.remove('has-image');
      refs.img.removeAttribute('src');
      refs.link.removeAttribute('href');
      refs.meta.textContent = '未選択';
      return;
    }
    refs.preview.classList.add('has-image');
    refs.img.src = dataUrl;
    refs.link.href = dataUrl;
    refs.meta.textContent = metaText || ((dataUrl || '').startsWith('data:')
      ? `保存サイズ: ${formatBytes(dataUrlBytes(dataUrl))}`
      : '既存の写真');
  }
  async function downscaleImage(file, maxWidth = 1600, quality = 0.82) {
    const imageUrl = URL.createObjectURL(file);
    try {
      const image = await new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error('画像の読み込みに失敗しました'));
        img.src = imageUrl;
      });
      const scale = Math.min(1, maxWidth / image.width);
      const width = Math.max(1, Math.round(image.width * scale));
      const height = Math.max(1, Math.round(image.height * scale));
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(image, 0, 0, width, height);
      const dataUrl = canvas.toDataURL('image/jpeg', quality);
      const blob = await new Promise((resolve, reject) => {
        canvas.toBlob(result => {
          if (result) resolve(result);
          else reject(new Error('画像の圧縮に失敗しました'));
        }, 'image/jpeg', quality);
      });
      return {
        dataUrl,
        blob,
        width,
        height,
      };
    } finally {
      URL.revokeObjectURL(imageUrl);
    }
  }
  async function handlePhotoSelection(prefix, file) {
    if (!file) return;
    if (!file.type.startsWith('image/')) {
      showToast('⚠️', '画像ファイルを選択してください');
      return;
    }
    try {
      const { dataUrl, blob, width, height } = await downscaleImage(file);
      const uploadFile = new File([blob], makePhotoFileName(file.name || 'camera.jpg'), { type: 'image/jpeg' });
      pendingPhotoUploads[prefix] = { file: uploadFile };
      setPhotoPreview(prefix, dataUrl, `保存時にアップロード / ${width}x${height} / ${formatBytes(uploadFile.size)}`);
    } catch (error) {
      showToast('❌', error.message || '画像の処理に失敗しました');
    }
  }
  async function uploadPendingPhoto(prefix) {
    const pending = pendingPhotoUploads[prefix];
    if (!pending) {
      return document.getElementById(prefix + 'PhotoUrl').value.trim();
    }
    const path = buildPhotoStoragePath(prefix, pending.file.name);
    const { error: uploadError } = await db.storage
      .from(PHOTO_BUCKET)
      .upload(path, pending.file, {
        cacheControl: '3600',
        upsert: false,
        contentType: pending.file.type || 'image/jpeg',
      });
    if (uploadError) {
      throw new Error('写真アップロードに失敗しました: ' + uploadError.message);
    }
    const { data } = db.storage.from(PHOTO_BUCKET).getPublicUrl(path);
    const publicUrl = data?.publicUrl || '';
    if (!publicUrl) {
      throw new Error('写真URLの取得に失敗しました');
    }
    clearPendingPhoto(prefix);
    setPhotoPreview(prefix, publicUrl, 'アップロード済み');
    return publicUrl;
  }

  function parseNullableNumber(raw) {
    if (raw === '' || raw == null) return null;
    const n = Number(raw);
    return Number.isFinite(n) ? n : null;
  }
  function parseLatLngPair(raw) {
    const text = (raw || '').trim();
    if (!text) {
      return { isValid: true, latitude: null, longitude: null };
    }
    const parts = text.split(',').map(v => v.trim()).filter(Boolean);
    if (parts.length !== 2) {
      return { isValid: false, latitude: null, longitude: null };
    }
    const latitude = Number(parts[0]);
    const longitude = Number(parts[1]);
    if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) {
      return { isValid: false, latitude: null, longitude: null };
    }
    if (latitude < -90 || latitude > 90 || longitude < -180 || longitude > 180) {
      return { isValid: false, latitude: null, longitude: null };
    }
    return { isValid: true, latitude, longitude };
  }
  function buildCaseMapQuery(c) {
    if (c.location_address) return c.location_address;
    if (c.latitude != null && c.longitude != null) return `${c.latitude},${c.longitude}`;
    return '';
  }
  function buildCaseMapLink(c) {
    if (c.map_url) return c.map_url;
    const q = buildCaseMapQuery(c);
    return q ? `https://www.google.com/maps?q=${encodeURIComponent(q)}` : '';
  }
  function buildCaseMapEmbed(c) {
    if (c.map_url && c.map_url.includes('output=embed')) return c.map_url;
    const q = buildCaseMapQuery(c);
    return q ? `https://www.google.com/maps?q=${encodeURIComponent(q)}&output=embed` : '';
  }

  function getLoginCredentials() {
    const gateEmail = document.getElementById('gateLoginEmail').value.trim();
    const gatePassword = document.getElementById('gateLoginPassword').value;
    const headEmail = document.getElementById('loginEmail').value.trim();
    const headPassword = document.getElementById('loginPassword').value;

  function persistSharedSession(session) {
    try {
      if (session?.access_token && session?.refresh_token) {
        localStorage.setItem(SHARED_SESSION_KEY, JSON.stringify({
          access_token: session.access_token,
          refresh_token: session.refresh_token,
        }));
      } else {
        localStorage.removeItem(SHARED_SESSION_KEY);
      }
    } catch (_) {
      // ignore storage failures (private mode, quota)
    }
  }

  function updateAuthUi() {
    const isAuthed = !!currentSession?.user;
    document.getElementById('loginEmail').classList.toggle('hidden-auth', isAuthed);
    document.getElementById('loginPassword').classList.toggle('hidden-auth', isAuthed);
    document.getElementById('loginBtn').classList.toggle('hidden-auth', isAuthed);
    document.getElementById('logoutBtn').classList.toggle('hidden-auth', !isAuthed);
    document.getElementById('forgotPasswordBtn').classList.toggle('hidden-auth', isAuthed);
    document.getElementById('gateAuthStatus').textContent = isAuthed
      ? `ログイン中: ${currentSession.user.email}`
      : '未ログイン';
    setAuthGateVisible(!isAuthed);

    if (isAuthed && !hasLoadedCases) {
      hasLoadedCases = true;
      loadCases();
    }
    if (!isAuthed) {
      hasLoadedCases = false;
    }
  }

  async function loginSystem() {
    const { email, password } = getLoginCredentials();
    if (!email || !password) {
      showToast('⚠️', 'メールアドレスとパスワードを入力してください');
      return;
    }
    const { data, error } = await db.auth.signInWithPassword({ email, password });
    if (error) {
      showToast('❌', 'ログインに失敗しました: ' + error.message);
      return;
    }
    currentSession = data.session || null;
    persistSharedSession(currentSession);
    updateAuthUi();
    showToast('✅', 'ログインしました');
  }

    const { error } = await db.auth.signOut();

      showToast('❌', 'ログアウトに失敗しました: ' + error.message);
      return;

    currentSession = null;
    persistSharedSession(null);

  // ===== Filter & sort (クライアントサイド) =====
  function filtered() {
    const q   = document.getElementById('searchInput').value.toLowerCase();
    const st  = document.getElementById('statusFilter').value;
    const pr  = document.getElementById('priorityFilter').value;
    const srt = document.getElementById('sortSelect').value;
    const showDeletedOnly = st === '削除待ち';
    let list = cases.filter(c => {
      const matchQ  = !q  || [c.name, c.client, c.assignee].some(v => (v || '').toLowerCase().includes(q));
      const matchQLocation = !q || (c.location_address || '').toLowerCase().includes(q);
      const matchDeleted = showDeletedOnly ? !!c.is_deleted : !c.is_deleted;
      const matchSt = showDeletedOnly ? true : (!st || c.status === st);
      const matchPr = !pr || c.priority === pr;
      const isCompletedWork = c.work_status === '完了';
      const matchWorkView = workViewMode === 'completed' ? isCompletedWork : !isCompletedWork;
      return (matchQ || matchQLocation) && matchDeleted && matchSt && matchPr && matchWorkView;
    });
    list = list.slice().sort((a, b) => {
      if (srt === 'assignee_asc') {
        return (a.assignee || '').localeCompare(b.assignee || '', 'ja') || (b.id - a.id);
      }
      if (srt === 'id_asc')       return a.id - b.id;
      if (srt === 'name_asc')     return (a.name || '').localeCompare(b.name || '');
      if (srt === 'deadline_asc') return (a.deadline || '').localeCompare(b.deadline || '');
      return (a.assignee || '').localeCompare(b.assignee || '', 'ja') || (b.id - a.id);
    });
    return list;
  }

    currentPage = 1;

  function updateKPI() {
    const base = filtered();
    const total = base.length;
    const inp   = base.filter(c => c.status === '進行中').length;
    const comp  = base.filter(c => c.status === '完了').length;
    const pend  = base.filter(c => c.status === '保留').length;
    const canc  = base.filter(c => c.status === 'キャンセル').length;
    const pct = v => total ? Math.round(v / total * 100) : 0;
    document.getElementById('kpiTotal').textContent      = total;
    document.getElementById('kpiInProgress').textContent = inp;
    document.getElementById('kpiCompleted').textContent  = comp;
    document.getElementById('kpiPending').textContent    = pend;
    document.getElementById('kpiCancelled').textContent  = canc;
    document.getElementById('kpiInProgressPct').textContent = `全体の ${pct(inp)}%`;
    document.getElementById('kpiCompletedPct').textContent  = `全体の ${pct(comp)}%`;
    document.getElementById('kpiPendingPct').textContent    = `全体の ${pct(pend)}%`;
    document.getElementById('kpiCancelledPct').textContent  = `全体の ${pct(canc)}%`;
    document.getElementById('barInProgress').style.width = pct(inp)  + '%';
    document.getElementById('barCompleted').style.width  = pct(comp) + '%';
    document.getElementById('barPending').style.width    = pct(pend) + '%';
    document.getElementById('barCancelled').style.width  = pct(canc) + '%';
  }

    document.getElementById('countBadge').textContent = total + ' 件';
    document.getElementById('pageInfo').textContent = total === 0
      ? '0 件'
      : `${total} 件中 ${Math.min((currentPage - 1) * PAGE_SIZE + 1, total)}–${Math.min(currentPage * PAGE_SIZE, total)} 件表示`;

    const tableWrap = document.getElementById('tableViewWrap');
    const tileWrap = document.getElementById('tileViewWrap');
    const tbody = document.getElementById('tableBody');
    const tileGrid = document.getElementById('tileGrid');
    const showTile = listLayoutMode === 'tile';

    tileWrap.classList.toggle('hidden', !showTile);

    if (slice.length === 0) {
      tbody.innerHTML = `<tr><td colspan="10" style="text-align:center;color:var(--text-sub);padding:40px">該当する案件が見つかりません</td></tr>`;

            <button class="action-btn" onclick="deleteCase(${c.id})" title="${c.is_deleted ? '完全削除' : '削除フラグ'}">🗑</button>
          </td>
        </tr>`).join('');

      tileGrid.innerHTML = slice.map(c => `
        <article class="case-tile ${c.is_deleted ? 'deleted' : ''}" onclick="openEdit(${c.id})">
          <div class="case-tile-head">
            <div>
              <div class="case-tile-id">${fmtId(c.id)}</div>
              <div class="case-tile-name">${c.name}</div>
            </div>
            ${c.is_deleted ? deletedBadge('削除待ち') : statusBadge(c.status)}
          </div>
          <dl class="case-tile-meta">
            <dt>依頼元</dt><dd>${c.client}</dd>
            <dt>依頼先担当</dt><dd>${c.assignee || '—'}</dd>
            <dt>作業</dt><dd><span class="work-status work-status-${workStatusClass[c.work_status] || 'notstarted'}">${c.work_status || '未着手'}</span></dd>
            <dt>優先度</dt><dd>${priorityBadge(c.priority)}</dd>
            <dt>場所</dt><dd>${c.location_address || '—'}</dd>
            <dt>期限</dt><dd>${c.deadline || '—'}</dd>
          </dl>
          <div class="case-tile-actions" onclick="event.stopPropagation()">
            <button class="action-btn ${c.photo_url ? 'action-btn-active' : 'action-btn-inactive'}" ${c.photo_url ? `onclick="openPhotoViewer('${c.photo_url}', '写真 — ${c.name}')"` : ''} title="${c.photo_url ? '写真を見る' : '写真なし'}">📷</button>
            <button class="action-btn" onclick="openMapViewer(${c.id})" title="地図を見る">📍</button>
            <button class="action-btn ${c.attachment_url ? 'action-btn-active' : 'action-btn-inactive'}" ${c.attachment_url ? `onclick="openAttachmentViewer('${c.attachment_url}', '資料 — ${c.name}')"` : ''} title="${c.attachment_url ? '資料を見る' : '資料なし'}">📎</button>
            <button class="action-btn" onclick="openTimeline(${c.id})" title="実施履歴">🕒</button>
            <button class="action-btn" onclick="deleteCase(${c.id})" title="${c.is_deleted ? '完全削除' : '削除フラグ'}">🗑</button>
          </div>
        </article>`).join('');
    }

    // Pagination
    const pb = document.getElementById('pageBtns');
    pb.innerHTML = '';
    for (let i = 1; i <= pages; i++) {
      const btn = document.createElement('div');
      btn.className = 'page-btn' + (i === currentPage ? ' active' : '');
      btn.textContent = i;
      btn.onclick = () => { currentPage = i; renderTable(); };
      pb.appendChild(btn);
    }
  }

  // ===== Modal =====
  function openModal(reset = true) {
    if (!requireAuth()) return;
    if (reset) {
      editingId = null;
      timelineCaseId = null;
      document.getElementById('modalTitle').textContent = '新規案件登録';
      document.getElementById('saveBtn').textContent = '登録する';
      document.getElementById('openTimelineBtn').classList.add('hidden');
      ['fName', 'fClient', 'fRequestedTo', 'fAssignee', 'fStartDate', 'fDeadline', 'fNote', 'fPhotoUrl', 'fAttachmentUrl', 'fLocationAddress', 'fLatLng', 'fMapUrl'].forEach(id => document.getElementById(id).value = '');
      setPhotoPreview('f', '');
      document.getElementById('fStatus').value   = '新規';
      document.getElementById('fWorkStatus').value = '未着手';
      document.getElementById('fPriority').value = '中';
      refreshCaseMapPreview();
    }
    document.getElementById('modalOverlay').classList.add('open');
  }
  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
  }

  function openEdit(id) {
    const c = cases.find(x => x.id === id);
    if (!c) return;
    editingId = id;
    timelineCaseId = id;
    document.getElementById('modalTitle').textContent = '案件編集';
    document.getElementById('saveBtn').textContent = '更新する';
    document.getElementById('openTimelineBtn').classList.remove('hidden');
    document.getElementById('fName').value      = c.name;
    document.getElementById('fClient').value    = c.client;
    document.getElementById('fRequestedTo').value = c.requested_to || '';
    document.getElementById('fAssignee').value  = c.assignee || '';
    document.getElementById('fStatus').value    = c.status;
    document.getElementById('fWorkStatus').value = c.work_status || '未着手';
    document.getElementById('fPriority').value  = c.priority;
    document.getElementById('fPhotoUrl').value  = c.photo_url || '';
    setPhotoPreview('f', c.photo_url || '', c.photo_url
      ? ((c.photo_url || '').startsWith('data:')
        ? `保存サイズ: ${formatBytes(dataUrlBytes(c.photo_url))}`
        : '既存の写真')
      : '');
    document.getElementById('fAttachmentUrl').value = c.attachment_url || '';
    document.getElementById('fLocationAddress').value = c.location_address || '';
    document.getElementById('fLatLng').value = (c.latitude != null && c.longitude != null)
      ? `${c.latitude}, ${c.longitude}`
      : '';
    document.getElementById('fMapUrl').value = c.map_url || '';
    document.getElementById('fDeadline').value  = c.deadline || '';
    document.getElementById('fNote').value      = c.note || '';
    refreshCaseMapPreview();
    openModal(false);
  }

  async function openTimeline(caseId) {
    const c = cases.find(x => x.id === caseId);
    if (!c) return;
    timelineCaseId = caseId;
    document.getElementById('timelineTitle').textContent = `案件実施履歴: ${c.name}`;
    document.getElementById('tPerformedOn').value = new Date().toISOString().slice(0, 10);
    document.getElementById('tTitle').value = '';
    document.getElementById('tRequestedTo').value = c.requested_to || '';
    document.getElementById('tAssignee').value = c.assignee || '';
    document.getElementById('tWorkStatus').value = '未着手';
    document.getElementById('tPhotoUrl').value = '';
    setPhotoPreview('t', '');
    document.getElementById('tAttachmentUrl').value = '';
    document.getElementById('tDetail').value = '';
    document.getElementById('timelineOverlay').classList.add('open');
    await loadActivities(caseId);
  }

  function closeTimeline() {
    document.getElementById('timelineOverlay').classList.remove('open');
  }

  function renderActivities() {
    const container = document.getElementById('timelineList');
    if (!activities.length) {
      container.innerHTML = '<div class="timeline-empty">まだ履歴がありません</div>';
      return;
    }
    container.innerHTML = activities.map(item => `
      <div class="timeline-item ${item.is_deleted ? 'deleted' : ''}">
        <div class="timeline-item-head">
          <div class="timeline-item-title">${item.title}</div>
          ${item.is_deleted ? deletedBadge('削除待ち') : `<span class="work-status work-status-${workStatusClass[item.work_status] || 'notstarted'}">${item.work_status || '未着手'}</span>`}
          <button class="action-btn" onclick="removeTimeline(${item.id})" title="${item.is_deleted ? '完全削除' : '削除フラグ'}">🗑</button>
        </div>
        <div class="timeline-meta">${item.performed_on} / ${item.requested_to || '—'} - ${item.assignee || '—'}${item.deleted_at ? ` / ${item.deleted_at.slice(0, 16).replace('T', ' ')}` : ''}</div>
        <div class="timeline-item-detail">${item.detail || ''}</div>
        <div class="timeline-links">
          ${item.photo_url ? `<button class="action-btn action-btn-active" onclick="openPhotoViewer('${item.photo_url}', '写真 — ${item.title}')" style="font-size:22px;padding:4px 6px" title="写真を見る">📷</button>` : ''}
          ${item.attachment_url ? `<button class="action-btn action-btn-active" onclick="openAttachmentViewer('${item.attachment_url}', '資料 — ${item.title}')" style="font-size:22px;padding:4px 6px" title="資料を見る">📎</button>` : ''}
        </div>
      </div>
    `).join('');
  }

  async function addTimelineEntry() {
    if (!timelineCaseId) return;
    const currentCase = cases.find(x => x.id === timelineCaseId);
    if (currentCase?.is_deleted) {
      showToast('⚠️', '削除待ちの案件には履歴を追加できません');
      return;
    }
    const performedOn = document.getElementById('tPerformedOn').value;
    const title = document.getElementById('tTitle').value.trim();
    const requestedTo = document.getElementById('tRequestedTo').value.trim() || '';
    const assignee = document.getElementById('tAssignee').value.trim() || '';
    const workStatus = document.getElementById('tWorkStatus').value;

    if (!performedOn || !title) {
      showToast('⚠️', '実施日とタイトルは必須です');
      return;
    }

    setTimelineSaveLoading(true);
    let ok = false;
    try {
      const photoUrl = await uploadPendingPhoto('t');
      const attachmentUrl = document.getElementById('tAttachmentUrl').value.trim();
      const detail = document.getElementById('tDetail').value.trim();
      ok = await insertActivity({
        case_id: timelineCaseId,
        performed_on: performedOn,
        title,
        requested_to: requestedTo,
        assignee,
        work_status: workStatus,
        photo_url: photoUrl,
        attachment_url: attachmentUrl,
        detail,
      });
    } catch (error) {
      showToast('❌', error.message || '写真の保存に失敗しました');
    }
    setTimelineSaveLoading(false);
    if (!ok) return;

    showToast('✅', '履歴を保存しました');
    document.getElementById('tTitle').value = '';
    document.getElementById('tPhotoUrl').value = '';
    setPhotoPreview('t', '');
    document.getElementById('tAttachmentUrl').value = '';
    document.getElementById('tDetail').value = '';
    await loadActivities(timelineCaseId);
  }

  async function removeTimeline(id) {
    const item = activities.find(x => x.id === id);
    if (!item) return;
    const confirmed = item.is_deleted
      ? confirm('2段階目の削除です。この履歴を完全削除しますか？')
      : confirm('1段階目の削除です。削除フラグを立てます。2回目の削除で完全削除されます。実行しますか？');
    if (!confirmed) return;
    const ok = item.is_deleted ? await hardDeleteActivity(id) : await softDeleteActivity(id);
    if (!ok) return;
    showToast('🗑', item.is_deleted ? '履歴を完全削除しました' : '履歴を削除待ちにしました');
    await loadActivities(timelineCaseId);
  }

  async function saveCase() {
    if (!requireAuth()) return;
    const name   = document.getElementById('fName').value.trim();
    const client = document.getElementById('fClient').value.trim();
    if (!name || !client) { showToast('⚠️', '案件名と依頼元は必須です'); return; }
    const latLng = parseLatLngPair(document.getElementById('fLatLng').value);
    if (!latLng.isValid) {
      showToast('⚠️', '緯度経度は「緯度, 経度」の形式で入力してください');
      return;
    }
    setSaveLoading(true);
    let ok = false;
    try {
      const photoUrl = await uploadPendingPhoto('f');
      const payload = {
        name,
        client,
        requested_to: document.getElementById('fRequestedTo').value.trim() || '',
        assignee: document.getElementById('fAssignee').value.trim() || '未割当',
        status:   document.getElementById('fStatus').value,
        work_status: document.getElementById('fWorkStatus').value,
        priority: document.getElementById('fPriority').value,
        photo_url: photoUrl,
        attachment_url: document.getElementById('fAttachmentUrl').value.trim(),
        location_address: document.getElementById('fLocationAddress').value.trim(),
        latitude: latLng.latitude,
        longitude: latLng.longitude,
        map_url: document.getElementById('fMapUrl').value.trim(),
        deadline: document.getElementById('fDeadline').value || null,
        note:     document.getElementById('fNote').value.trim(),
      };

      if (editingId) {
        ok = await updateCase(editingId, payload);
        if (ok) showToast('✅', '案件を更新しました');
      } else {
        ok = await insertCase(payload);
        if (ok) showToast('✅', '新規案件を登録しました');
      }
    } catch (error) {
      showToast('❌', error.message || '写真の保存に失敗しました');
    }
    setSaveLoading(false);
    if (ok) {
      closeModal();
      currentPage = 1;
      await loadCases();
    }
  }

  async function deleteCase(id) {
    const item = cases.find(x => x.id === id);
    if (!item) return;
    const confirmed = item.is_deleted
      ? confirm('2段階目の削除です。案件本体、実施履歴、保存済み写真を完全削除しますか？')
      : confirm('1段階目の削除です。削除フラグを立てます。2回目の削除で関連データを含め完全削除されます。実行しますか？');
    if (!confirmed) return;
    const ok = item.is_deleted ? await hardDeleteCase(id) : await softDeleteCase(id);
    if (ok) {
      showToast('🗑', item.is_deleted ? '案件を完全削除しました' : '案件を削除待ちにしました');
      await loadCases();
      if (timelineCaseId === id && item.is_deleted) {
        closeTimeline();
      }
    }
  }

  // ===== Toast =====
  function showToast(icon, msg) {
    const t = document.getElementById('toast');
    document.getElementById('toastIcon').textContent = icon;
    document.getElementById('toastMsg').textContent  = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  // ===== Export (CSV) =====
  function exportCSV() {
    const header = ['案件ID', '案件名', '依頼元', '依頼先', '依頼先担当者', 'ステータス', '作業ステータス', '優先度', '削除フラグ', '削除日時', '場所', '緯度', '経度', '地図URL', '写真URL', '添付ファイルURL', '期限', '備考'];
    const rows   = cases.map(c => [
      fmtId(c.id),
      c.name,
      c.client,
      c.requested_to || '',
      c.assignee,
      c.status,
      c.work_status || '',
      c.priority,
      c.is_deleted ? '1' : '0',
      c.deleted_at || '',
      c.location_address || '',
      c.latitude ?? '',
      c.longitude ?? '',
      c.map_url || '',
      c.photo_url || '',
      c.attachment_url || '',
      c.deadline || '',
      c.note || ''
    ]);
    const csv    = [header, ...rows].map(r => r.map(v => `"${v}"`).join(',')).join('\n');
    const bom    = '\uFEFF';
    const blob   = new Blob([bom + csv], { type: 'text/csv;charset=utf-8;' });
    const url    = URL.createObjectURL(blob);
    const a      = document.createElement('a'); a.href = url; a.download = '案件一覧.csv'; a.click();
    URL.revokeObjectURL(url);
    showToast('⬇', 'CSVをエクスポートしました');
  }

  // ===== Event listeners =====
  document.getElementById('openModalBtn').onclick   = () => openModal(true);
  document.getElementById('gateLoginBtn').onclick   = loginSystem;
  document.getElementById('gateForgotPasswordBtn').onclick = sendPasswordRecovery;
  document.getElementById('loginBtn').onclick       = loginSystem;
  document.getElementById('logoutBtn').onclick      = logoutSystem;
  document.getElementById('forgotPasswordBtn').onclick = sendPasswordRecovery;
  document.getElementById('closeModalBtn').onclick  = closeModal;
  document.getElementById('cancelModalBtn').onclick = closeModal;
  document.getElementById('openTimelineBtn').onclick = () => openTimeline(timelineCaseId);
  document.getElementById('closeTimelineBtn').onclick = closeTimeline;
  document.getElementById('addTimelineBtn').onclick = addTimelineEntry;
  document.getElementById('saveBtn').onclick        = saveCase;
  document.getElementById('openSurveyBtn').onclick  = () => window.open('survey.html', '_blank');
  document.getElementById('exportBtn').onclick      = exportCSV;
  document.getElementById('showCompletedBtn').onclick = () => setWorkViewMode('completed');
  document.getElementById('showInProgressBtn').onclick = () => setWorkViewMode('active');
  document.getElementById('tableLayoutBtn').onclick  = () => setListLayoutMode('table');
  document.getElementById('tileLayoutBtn').onclick   = () => setListLayoutMode('tile');
  document.getElementById('gateLoginPassword').addEventListener('keydown', (event) => {
    if (event.key === 'Enter') loginSystem();
  });
  document.getElementById('loginPassword').addEventListener('keydown', (event) => {
    if (event.key === 'Enter') loginSystem();
  });
  bindPhotoField('f');
  bindPhotoField('t');
  setTimelineSaveLoading(false);
  document.getElementById('modalOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('modalOverlay')) closeModal();
  });
  document.getElementById('timelineOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('timelineOverlay')) closeTimeline();
  });
  document.getElementById('viewerOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('viewerOverlay')) closeViewer();
  });
  ['searchInput', 'statusFilter', 'priorityFilter', 'sortSelect'].forEach(id => {
    document.getElementById(id).addEventListener('input',  () => { currentPage = 1; renderTable(); });
    document.getElementById(id).addEventListener('change', () => { currentPage = 1; renderTable(); });
  });
  ['fLocationAddress', 'fLatLng', 'fMapUrl'].forEach(id => {
    document.getElementById(id).addEventListener('input', refreshCaseMapPreview);
  });

  // ===== Init =====
  db.auth.getSession().then(({ data }) => {
    currentSession = data.session || null;
    persistSharedSession(currentSession);
    updateAuthUi();
  });
  db.auth.onAuthStateChange((_event, session) => {
    currentSession = session;
    persistSharedSession(session);
    updateAuthUi();
  });
  setAuthGateVisible(true);
</script>
</body>
</html>
