<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>アンケート回答</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;700&display=swap');

    :root {
      --primary: #0f766e;
      --primary-dk: #0b5f59;
      --surface: #ffffff;
      --surface-sub: #fcfdfd;
      --bg: #f3f6f7;
      --bg-ornament: #e8efe8;
      --border: #d9e2de;
      --text: #000000;
      --sub: #000000;
      --danger: #dc2626;
      --ok: #16a34a;
      --font-main: "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", "Noto Serif JP", serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--font-main);
      background:
        radial-gradient(circle at 8% 10%, var(--bg-ornament) 0, transparent 34%),
        radial-gradient(circle at 92% 5%, #f0e8dd 0, transparent 30%),
        linear-gradient(180deg, var(--bg) 0%, #f7faf9 100%);
      color: var(--text);
      min-height: 100vh;
    }

    .wrap {
      max-width: 920px;
      margin: 0 auto;
      padding: 30px 16px 52px;
    }

    .tile {
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      padding: 16px 18px;
      box-shadow: 0 8px 22px rgba(18, 39, 31, .06);
      margin-top: 12px;
    }

    .hero {
      border-radius: 16px;
      background:
        radial-gradient(circle at 95% -10%, #f7e7c4 0 30%, transparent 31%),
        linear-gradient(160deg, #fdfcf8 0%, #f8f7f1 100%);
      border: 1px solid #e4ddcc;
      margin-top: 0;
      padding: 18px 20px;
    }

    .tile-title {
      margin: 0 0 8px;
      font-size: 15px;
      font-weight: 700;
      color: #000000;
      letter-spacing: .02em;
    }
    .tile-title-strong {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: .01em;
      color: #000000;
    }

    h1 {
      margin: 0;
      font-family: var(--font-main);
      font-size: 28px;
      line-height: 1.3;
      letter-spacing: .02em;
    }

    .sub {
      color: var(--sub);
      margin: 8px 0 0;
      font-size: 14px;
      line-height: 1.65;
      white-space: pre-wrap;
    }

    .outline-grid {
      display: grid;
      grid-template-columns: 98px 1fr;
      gap: 8px 12px;
      font-size: 13px;
      line-height: 1.6;
    }

    .outline-grid dt {
      color: #60717f;
      font-weight: 700;
    }

    .outline-grid dd {
      margin: 0;
      color: var(--text);
    }

    .program-list {
      margin: 0;
      padding-left: 18px;
      color: var(--text);
      display: grid;
      gap: 6px;
      font-size: 13px;
      line-height: 1.6;
    }

    .split {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 12px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }

    label {
      font-size: 13px;
      font-weight: 700;
    }

    .req {
      color: var(--danger);
      font-size: 12px;
      margin-left: 4px;
    }

    input[type="text"], textarea, select {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      font-family: var(--font-main);
      outline: none;
      background: #fff;
    }

    input[type="text"]:focus,
    textarea:focus,
    select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, .14);
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .question-card {
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface-sub);
      padding: 14px;
      margin-top: 14px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.6);
    }

    .question-card .label-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .question-card .label-line label {
      font-size: 14px;
    }

    .question-description {
      margin: -2px 0 8px;
      color: var(--sub);
      font-size: 12px;
      line-height: 1.55;
      white-space: pre-wrap;
    }

    .radio-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .radio-item {
      display: flex;
      gap: 8px;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 10px;
      background: #fff;
    }

    .helper {
      color: #000000;
      font-size: 12px;
      line-height: 1.5;
    }

    .actions {
      margin-top: 4px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 700;
      font-family: var(--font-main);
      cursor: pointer;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-dk);
    }

    .small-note {
      color: #000000;
      font-size: 12px;
      line-height: 1.6;
      margin: 8px 0 0;
    }

    .msg {
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      display: none;
      margin-top: 12px;
    }

    .msg.show { display: block; }

    .msg.ok {
      border: 1px solid #bbf7d0;
      background: #f0fdf4;
      color: #166534;
    }

    .msg.ng {
      border: 1px solid #fecaca;
      background: #fef2f2;
      color: #991b1b;
    }

    @media (min-width: 840px) {
      .split { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="tile hero">
      <p class="tile-title">タイトルタイル</p>
      <h1 id="formTitle">アンケート</h1>
    </section>

    <section class="tile">
      <p class="tile-title tile-title-strong">ご案内</p>
      <p class="sub" id="formIntro">読み込み中...</p>
    </section>

    <section class="tile">
      <p class="tile-title tile-title-strong">開催概要</p>
      <dl class="outline-grid">
        <dt>日程</dt><dd id="outlineDate">アンケート案内文に応じてご確認ください。</dd>
        <dt>会場</dt><dd id="outlineVenue">オンラインまたは指定会場</dd>
        <dt>参加費</dt><dd id="outlineFee">無料</dd>
        <dt>対象</dt><dd id="outlineTarget">関係者のみなさま</dd>
      </dl>
    </section>

    <section class="tile">
      <p class="tile-title tile-title-strong">プログラム内容</p>
      <ul class="program-list" id="programList">
        <li>ご挨拶・趣旨説明</li>
        <li>関連トピックの共有</li>
        <li>質疑応答</li>
      </ul>
    </section>

    <form id="surveyAnswerForm" style="display:none;">
      <div class="split">
        <section class="tile">
          <p class="tile-title tile-title-strong">お申し込みフォーム</p>
          <div class="field" id="fieldNameRow">
            <label for="respondentName">氏名 <span class="req" id="reqName"></span></label>
            <input id="respondentName" type="text" placeholder="例: 山本 太郎" required />
          </div>
          <div class="field" id="fieldEmailRow">
            <label for="respondentEmail">メールアドレス <span class="req" id="reqEmail"></span></label>
            <input id="respondentEmail" type="text" placeholder="例: user@example.com" required />
            <div class="helper">回答受付後、このメールアドレスに確認メールを送信します。</div>
          </div>
          <div class="field" id="fieldPhoneRow">
            <label for="respondentPhone">電話番号 <span class="req" id="reqPhone"></span></label>
            <input id="respondentPhone" type="text" placeholder="例: 090-1234-5678" />
          </div>
          <div class="field" id="fieldCompanyRow">
            <label for="respondentCompany">会社名・所属 <span class="req" id="reqCompany"></span></label>
            <input id="respondentCompany" type="text" placeholder="例: 株式会社〇〇 / 営業部" />
          </div>
          <div class="field" id="fieldNoteRow" style="margin-bottom:0;">
            <label for="respondentNote">備考 <span class="req" id="reqNote"></span></label>
            <textarea id="respondentNote" placeholder="ご要望や連絡事項があればご記入ください"></textarea>
          </div>
        </section>

        <section class="tile">
          <p class="tile-title tile-title-strong">アンケート・質問</p>
          <div class="helper">アンケート回答フォーム</div>
          <div id="dynamicQuestions"></div>
        </section>
      </div>

      <section class="tile">
        <input id="hpField" type="text" style="display:none" autocomplete="off" tabindex="-1" />
        <div class="actions">
          <button class="btn btn-primary" id="submitBtn" type="submit">送信する</button>
        </div>
      </section>
    </form>

    <div class="msg" id="statusMsg"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script>
    const SUPABASE_URL = 'https://vspmaejoftjvooohfqbu.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZzcG1hZWpvZnRqdm9vb2hmcWJ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyODkxODQsImV4cCI6MjA5Mzg2NTE4NH0.vt33TF7OfmNHOMFUP-_Ch6TESVBPW22d-1W3LKkbrHI';

    // EmailJS settings: set your values to enable confirmation mail.
    const EMAILJS_PUBLIC_KEY = '4Xt6mEmbuSxVZpy7f';
    const EMAILJS_SERVICE_ID = 'service_072qk2p';
    const EMAILJS_TEMPLATE_ID = 'template_42yb5fi';

    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const formEl = document.getElementById('surveyAnswerForm');
    const titleEl = document.getElementById('formTitle');
    const introEl = document.getElementById('formIntro');
    const outlineDateEl = document.getElementById('outlineDate');
    const outlineVenueEl = document.getElementById('outlineVenue');
    const outlineFeeEl = document.getElementById('outlineFee');
    const outlineTargetEl = document.getElementById('outlineTarget');
    const programListEl = document.getElementById('programList');
    const questionsEl = document.getElementById('dynamicQuestions');
    const statusEl = document.getElementById('statusMsg');
    const submitBtn = document.getElementById('submitBtn');

    let currentForm = null;
    let currentEditToken = '';
    let isEditMode = false;
    let editDeadlineAt = null;
    let currentEditPolicy = { days_before_event: 3, max_edits: -1 };
    let currentApplicationFields = {
      name: { visible: true, required: true },
      email: { visible: true, required: true },
      phone: { visible: true, required: false },
      company: { visible: true, required: false },
      note: { visible: true, required: false },
    };

    function showStatus(message, ok) {
      statusEl.textContent = message;
      statusEl.className = 'msg show ' + (ok ? 'ok' : 'ng');
    }

    function getToken() {
      const params = new URLSearchParams(location.search);
      return (params.get('token') || '').trim();
    }

    function getEditToken() {
      const params = new URLSearchParams(location.search);
      return (params.get('edit') || '').trim();
    }

    function generateEditToken() {
      if (window.crypto?.randomUUID) return window.crypto.randomUUID();
      return `ed-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 12)}`;
    }

    function getEditUrl(formToken, editToken) {
      const u = new URL(location.href);
      u.searchParams.set('token', formToken || getToken());
      u.searchParams.set('edit', editToken);
      return u.toString();
    }

    function parseQuestions(raw) {
      if (Array.isArray(raw)) return raw;
      if (!raw) return [];
      try {
        const parsed = typeof raw === 'string' ? JSON.parse(raw) : raw;
        return Array.isArray(parsed) ? parsed : [];
      } catch (_) {
        return [];
      }
    }

    function parseOutline(raw) {
      if (!raw || typeof raw !== 'object' || Array.isArray(raw)) {
        return { date: '', venue: '', fee: '', target: '', application_fields: null, edit_policy: null };
      }
      return {
        date: String(raw.date || '').trim(),
        venue: String(raw.venue || '').trim(),
        fee: String(raw.fee || '').trim(),
        target: String(raw.target || '').trim(),
        application_fields: raw.application_fields,
        edit_policy: raw.edit_policy,
      };
    }

    function normalizeEditPolicy(raw) {
      const source = raw && typeof raw === 'object' ? raw : {};
      let days = Number(source.days_before_event);
      let max = Number(source.max_edits);
      if (!Number.isFinite(days)) days = 3;
      if (!Number.isFinite(max)) max = -1;
      days = Math.max(0, Math.floor(days));
      max = Math.floor(max);
      if (max < -1) max = -1;
      return {
        days_before_event: days,
        max_edits: max,
      };
    }

    function formatEditLimit(policy) {
      if (!policy || policy.max_edits === 0) return '修正不可';
      if (policy.max_edits < 0) return '回数無制限';
      return `${policy.max_edits}回まで`;
    }

    function parseProgram(raw) {
      if (!Array.isArray(raw)) return [];
      return raw.map(v => String(v || '').trim()).filter(Boolean);
    }

    function normalizeApplicationFields(raw) {
      const defaults = {
        name: { visible: true, required: true },
        email: { visible: true, required: true },
        phone: { visible: true, required: false },
        company: { visible: true, required: false },
        note: { visible: true, required: false },
      };
      const source = raw && typeof raw === 'object' ? raw : {};
      const normalized = { ...defaults };
      Object.keys(defaults).forEach((key) => {
        const item = source[key] && typeof source[key] === 'object' ? source[key] : {};
        const visible = item.visible !== false;
        const required = !!item.required && visible;
        normalized[key] = { visible, required };
      });
      return normalized;
    }

    function setFieldRule(key, settings) {
      const row = document.getElementById(`field${key}Row`);
      const req = document.getElementById(`req${key}`);
      const inputId = {
        Name: 'respondentName',
        Email: 'respondentEmail',
        Phone: 'respondentPhone',
        Company: 'respondentCompany',
        Note: 'respondentNote',
      }[key];
      const input = document.getElementById(inputId);

      row.style.display = settings.visible ? '' : 'none';
      req.textContent = settings.visible && settings.required ? '必須' : '';
      input.required = settings.visible && settings.required;
      if (!settings.visible) {
        input.value = '';
      }
    }

    function applyApplicationFields(raw) {
      currentApplicationFields = normalizeApplicationFields(raw);
      setFieldRule('Name', currentApplicationFields.name);
      setFieldRule('Email', currentApplicationFields.email);
      setFieldRule('Phone', currentApplicationFields.phone);
      setFieldRule('Company', currentApplicationFields.company);
      setFieldRule('Note', currentApplicationFields.note);
    }

    function renderOutline(outline) {
      outlineDateEl.textContent = outline.date || 'アンケート案内文に応じてご確認ください。';
      outlineVenueEl.textContent = outline.venue || 'オンラインまたは指定会場';
      outlineFeeEl.textContent = outline.fee || '無料';
      outlineTargetEl.textContent = outline.target || '関係者のみなさま';
    }

    function renderProgram(lines) {
      const list = lines.length ? lines : ['ご挨拶・趣旨説明', '関連トピックの共有', '質疑応答'];
      programListEl.innerHTML = list.map(line => `<li>${line}</li>`).join('');
    }

    function isValidEmail(value) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(value || '').trim());
    }

    function emailSendEnabled() {
      return !!(EMAILJS_PUBLIC_KEY && EMAILJS_SERVICE_ID && EMAILJS_TEMPLATE_ID && window.emailjs);
    }

    async function sendConfirmationMail(toEmail, toName, formTitle, editUrl = '', editDeadline = '開催日の3日前まで', editLimit = '回数無制限') {
      if (!emailSendEnabled()) {
        return { sent: false, skipped: true };
      }
      try {
        emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });
        await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
          to_email: toEmail,
          to_name: toName || 'ご回答者様',
          form_title: formTitle || 'アンケート',
          submitted_at: new Date().toLocaleString('ja-JP'),
          form_url: location.href,
          edit_url: editUrl,
          edit_deadline: editDeadline,
          edit_limit: editLimit,
        });
        return { sent: true, skipped: false };
      } catch (error) {
        return { sent: false, skipped: false, error };
      }
    }

    function renderQuestions(questions) {
      questionsEl.innerHTML = '';
      questions.forEach((q, index) => {
        const id = q.id || ('q' + index);
        const required = q.required ? 'required' : '';
        const requiredText = q.required ? '<span class="req">必須</span>' : '';
        const label = q.label || ('設問' + (index + 1));
        const description = q.description || '';

        let html = '';
        if (q.type === 'textarea') {
          html = `<textarea data-qid="${id}" ${required} placeholder="ご自由にご記入ください"></textarea>`;
        } else if (q.type === 'select') {
          const options = (q.options || []).map(opt => `<option value="${opt}">${opt}</option>`).join('');
          html = `
            <select data-qid="${id}" ${required}>
              <option value="">選択してください</option>
              ${options}
            </select>
          `;
        } else if (q.type === 'radio') {
          const options = (q.options || []).map((opt, i) => `
            <label class="radio-item"><input type="radio" name="radio_${id}" value="${opt}" ${required} ${i === 0 ? '' : ''} /> ${opt}</label>
          `).join('');
          html = `<div class="radio-group" data-radio="${id}">${options}</div>`;
        } else {
          html = `<input type="text" data-qid="${id}" ${required} placeholder="入力してください" />`;
        }

        const block = document.createElement('div');
        block.className = 'question-card';
        block.innerHTML = `
          <div class="label-line">
            <label>${label}${requiredText}</label>
            <span class="helper">${index + 1} / ${questions.length}</span>
          </div>
          ${description ? `<div class="question-description">${description}</div>` : ''}
          <div class="field">${html}</div>
        `;
        questionsEl.appendChild(block);
      });
    }

    function fillAnswers(questions, answers) {
      const data = answers && typeof answers === 'object' ? answers : {};
      questions.forEach((q, index) => {
        const id = q.id || ('q' + index);
        const value = data[id] == null ? '' : String(data[id]);
        if (q.type === 'radio') {
          const target = document.querySelector(`input[name="radio_${id}"][value="${value.replace(/"/g, '\\"')}"]`);
          if (target) target.checked = true;
          return;
        }
        const input = document.querySelector(`[data-qid="${id}"]`);
        if (input) input.value = value;
      });
    }

    async function loadEditableResponse() {
      if (!currentEditToken) return;
      const { data, error } = await db.rpc('survey_get_response_for_edit', {
        p_edit_token: currentEditToken,
      });
      if (error) {
        showStatus('修正情報の取得に失敗しました。', false);
        return;
      }
      const row = Array.isArray(data) ? data[0] : null;
      if (!row || !row.can_edit) {
        showStatus(row?.reason || 'この修正リンクは利用できません。', false);
        return;
      }
      isEditMode = true;
      editDeadlineAt = row.deadline_at || null;
      document.getElementById('respondentName').value = row.respondent_name || '';
      document.getElementById('respondentEmail').value = row.respondent_email || '';
      const app = row.client_meta?.application || {};
      document.getElementById('respondentPhone').value = app.phone || '';
      document.getElementById('respondentCompany').value = app.company || '';
      document.getElementById('respondentNote').value = app.note || '';
      fillAnswers(parseQuestions(currentForm.questions_json), row.answers_json || {});
      submitBtn.textContent = '修正を保存する';

      if (editDeadlineAt) {
        const deadlineText = new Date(editDeadlineAt).toLocaleString('ja-JP');
        showStatus(`修正モードです。修正期限: ${deadlineText}`, true);
      } else {
        showStatus('修正モードです。', true);
      }
    }

    function collectAnswers(questions) {
      const answers = {};
      for (const q of questions) {
        const id = q.id;
        if (q.type === 'radio') {
          const selected = document.querySelector(`input[name="radio_${id}"]:checked`);
          const value = selected ? selected.value : '';
          if (q.required && !value) return { error: `${q.label} は必須です。` };
          answers[id] = value;
          continue;
        }

        const input = document.querySelector(`[data-qid="${id}"]`);
        const value = (input?.value || '').trim();
        if (q.required && !value) return { error: `${q.label} は必須です。` };
        answers[id] = value;
      }
      return { answers };
    }

    async function loadForm() {
      const token = getToken();
      currentEditToken = getEditToken();
      if (!token) {
        titleEl.textContent = 'アンケートが指定されていません';
        introEl.textContent = 'URLに token パラメータが必要です。';
        return;
      }

      const { data, error } = await db
        .from('survey_forms')
        .select('id,title,intro_text,is_published,is_deleted,outline_json,program_json,questions_json')
        .eq('public_token', token)
        .maybeSingle();

      if (error || !data) {
        titleEl.textContent = 'アンケートが見つかりません';
        introEl.textContent = 'URLをご確認ください。';
        return;
      }

      if (!data.is_published || data.is_deleted) {
        titleEl.textContent = data.title || 'アンケート';
        introEl.textContent = 'このアンケートは現在公開されていません。';
        return;
      }

      currentForm = data;
      const questions = parseQuestions(data.questions_json);
      const outline = parseOutline(data.outline_json);
      const program = parseProgram(data.program_json);
      currentEditPolicy = normalizeEditPolicy(outline.edit_policy);
      applyApplicationFields(outline.application_fields);
      if (!questions.length) {
        titleEl.textContent = data.title || 'アンケート';
        introEl.textContent = '設問が設定されていません。管理者に連絡してください。';
        return;
      }

      titleEl.textContent = data.title || 'アンケート';
      introEl.textContent = data.intro_text || '以下の設問に回答してください。';
      renderOutline(outline);
      renderProgram(program);
      renderQuestions(questions);
      formEl.style.display = 'block';
      await loadEditableResponse();
    }

    formEl.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!currentForm) return;

      const honeypot = document.getElementById('hpField').value.trim();
      if (honeypot) {
        showStatus('送信に失敗しました。', false);
        return;
      }

      const questions = parseQuestions(currentForm.questions_json);
      const collected = collectAnswers(questions);
      if (collected.error) {
        showStatus(collected.error, false);
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = '送信中...';

      const respondentName = document.getElementById('respondentName').value.trim();
      const respondentEmail = document.getElementById('respondentEmail').value.trim();
      const respondentPhone = document.getElementById('respondentPhone').value.trim();
      const respondentCompany = document.getElementById('respondentCompany').value.trim();
      const respondentNote = document.getElementById('respondentNote').value.trim();

      if (currentApplicationFields.name.visible && currentApplicationFields.name.required && !respondentName) {
        submitBtn.disabled = false;
        submitBtn.textContent = '送信する';
        showStatus('氏名は必須です。', false);
        return;
      }
      if (currentApplicationFields.email.visible && currentApplicationFields.email.required && !respondentEmail) {
        submitBtn.disabled = false;
        submitBtn.textContent = '送信する';
        showStatus('メールアドレスは必須です。', false);
        return;
      }
      if (currentApplicationFields.phone.visible && currentApplicationFields.phone.required && !respondentPhone) {
        submitBtn.disabled = false;
        submitBtn.textContent = '送信する';
        showStatus('電話番号は必須です。', false);
        return;
      }
      if (currentApplicationFields.company.visible && currentApplicationFields.company.required && !respondentCompany) {
        submitBtn.disabled = false;
        submitBtn.textContent = '送信する';
        showStatus('会社名・所属は必須です。', false);
        return;
      }
      if (currentApplicationFields.note.visible && currentApplicationFields.note.required && !respondentNote) {
        submitBtn.disabled = false;
        submitBtn.textContent = '送信する';
        showStatus('備考は必須です。', false);
        return;
      }

      if (currentApplicationFields.email.visible && respondentEmail && !isValidEmail(respondentEmail)) {
        submitBtn.disabled = false;
        submitBtn.textContent = '送信する';
        showStatus('メールアドレス形式が正しくありません。', false);
        return;
      }

      const payload = {
        form_id: currentForm.id,
        respondent_name: respondentName || '未入力',
        respondent_email: respondentEmail,
        answers_json: collected.answers,
        client_meta: {
          userAgent: navigator.userAgent,
          language: navigator.language,
          submittedFrom: location.href,
          application: {
            phone: respondentPhone,
            company: respondentCompany,
            note: respondentNote,
            fields: currentApplicationFields,
          },
        },
      };

      let ok = true;
      let message = 'ご回答ありがとうございました。送信を受け付けました。';

      if (isEditMode && currentEditToken) {
        const { data, error } = await db.rpc('survey_update_response_by_token', {
          p_edit_token: currentEditToken,
          p_respondent_name: payload.respondent_name,
          p_respondent_email: payload.respondent_email,
          p_answers_json: payload.answers_json,
          p_client_meta: payload.client_meta,
        });

        submitBtn.disabled = false;
        submitBtn.textContent = '修正を保存する';

        if (error) {
          showStatus('修正に失敗しました: ' + error.message, false);
          return;
        }
        const row = Array.isArray(data) ? data[0] : null;
        if (!row?.success) {
          showStatus(row?.message || '修正に失敗しました。', false);
          return;
        }
        message = '回答内容を修正しました。';
      } else {
        payload.edit_token = generateEditToken();
        const { error } = await db.from('survey_responses').insert([payload]);

        submitBtn.disabled = false;
        submitBtn.textContent = '送信する';

        if (error) {
          if ((error.message || '').toLowerCase().includes('permission denied')) {
            showStatus('送信権限エラーです。管理者に「survey_setup.sql の再実行」を依頼してください。', false);
            return;
          }
          showStatus('送信に失敗しました: ' + error.message, false);
          return;
        }

        if (payload.respondent_email && isValidEmail(payload.respondent_email)) {
          const canEdit = currentEditPolicy.max_edits !== 0;
          const editUrl = canEdit ? getEditUrl(getToken(), payload.edit_token) : '';
          const editDeadline = `開催日の${currentEditPolicy.days_before_event}日前まで`;
          const editLimit = formatEditLimit(currentEditPolicy);
          const mailResult = await sendConfirmationMail(
            payload.respondent_email,
            payload.respondent_name,
            currentForm.title,
            editUrl,
            editDeadline,
            editLimit
          );
          if (mailResult.sent) {
            message = 'ご回答ありがとうございました。受付メールを送信しました。';
          } else if (!mailResult.skipped) {
            message = '回答は保存されましたが、確認メールの送信に失敗しました。';
            ok = false;
          }
        }
        formEl.reset();
      }

      showStatus(message, ok);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    loadForm();
  </script>
</body>
</html>
